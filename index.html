<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>合租生活管家 · 望京西园三区 503</title>
<meta name="description" content="陌生人共同生活的协调系统：把边界说清楚，让系统处理不值得开口的小事。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* ============ tokens ============ */
:root{
  --ground:#F6F5F1; --surface:#FFFFFF; --surface-2:#F0EFE9; --surface-3:#E8E7DF;
  --ink:#1B201D; --ink-2:#4C5752; --ink-3:#87908A; --ink-4:#A8B0AA;
  --line:#E3E1D9; --line-2:#D1CFC5;
  --jade:#2A7059; --jade-ink:#1F5B47; --jade-soft:#E2EFE9; --jade-line:#B7D8C8;
  --amber:#A3651E; --amber-soft:#F8EBD9; --amber-line:#E8CEA8;
  --clay:#AC4C38; --clay-soft:#F8E5E0; --clay-line:#E6C0B6;
  --slate:#3F5F80; --slate-soft:#E4EBF2; --slate-line:#BDCEE0;
  --shadow:0 1px 2px rgba(27,32,29,.045), 0 8px 22px -14px rgba(27,32,29,.2);
  --shadow-lg:0 20px 48px -20px rgba(27,32,29,.32);
  --r:16px; --r-lg:20px;
  --f-d:"Outfit","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --f-b:"Instrument Sans","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#131614; --surface:#1B1F1C; --surface-2:#232825; --surface-3:#2C322E;
  --ink:#ECEEEA; --ink-2:#ADB6B0; --ink-3:#7A837D; --ink-4:#636C66;
  --line:#2B312C; --line-2:#3A413B;
  --jade:#6FC5A0; --jade-ink:#91DAB9; --jade-soft:#1A2E25; --jade-line:#2D4C3E;
  --amber:#DCA765; --amber-soft:#2D2418; --amber-line:#483A23;
  --clay:#DE8873; --clay-soft:#321F1A; --clay-line:#4B2E26;
  --slate:#8FB2D6; --slate-soft:#1B242E; --slate-line:#2E3D4D;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 22px -14px rgba(0,0,0,.6);
  --shadow-lg:0 20px 48px -20px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --ground:#131614; --surface:#1B1F1C; --surface-2:#232825; --surface-3:#2C322E;
  --ink:#ECEEEA; --ink-2:#ADB6B0; --ink-3:#7A837D; --ink-4:#636C66;
  --line:#2B312C; --line-2:#3A413B;
  --jade:#6FC5A0; --jade-ink:#91DAB9; --jade-soft:#1A2E25; --jade-line:#2D4C3E;
  --amber:#DCA765; --amber-soft:#2D2418; --amber-line:#483A23;
  --clay:#DE8873; --clay-soft:#321F1A; --clay-line:#4B2E26;
  --slate:#8FB2D6; --slate-soft:#1B242E; --slate-line:#2E3D4D;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 22px -14px rgba(0,0,0,.6);
  --shadow-lg:0 20px 48px -20px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-b);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-d);margin:0;text-wrap:balance;letter-spacing:-.012em;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px;border-radius:7px}
.num{font-family:var(--f-d);font-variant-numeric:tabular-nums}

/* ============ shell ============ */
.shell{display:flex;min-height:100vh}
.rail{width:244px;flex:none;border-right:1px solid var(--line);background:var(--surface);padding:22px 15px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center}
.mark{width:34px;height:34px;flex:none;border-radius:11px;background:var(--jade);color:#fff;display:grid;place-items:center}
.mark svg{width:18px;height:18px}
.brand b{font-family:var(--f-d);font-size:15.5px;font-weight:600;display:block;line-height:1.25}
.brand span span{font-size:11px;color:var(--ink-3)}
.housecard{background:var(--surface-2);border-radius:13px;padding:11px 12px}
.housecard .hl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.housecard .hn{font-family:var(--f-d);font-weight:600;font-size:14px;margin-top:1px;line-height:1.35}
.housecard .ho{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.roster{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.rost{display:flex;align-items:center;gap:7px;font-size:12.5px}
.rost .nm{font-weight:500;color:var(--ink-2)}
.rost .st{margin-left:auto;font-size:11px;color:var(--ink-3);display:flex;align-items:center;gap:4px}
nav{display:flex;flex-direction:column;gap:2px}
.nv{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;border:0;background:none;width:100%;color:var(--ink-2);font-weight:500;font-size:14.5px}
.nv svg{width:17px;height:17px;flex:none;opacity:.7}
.nv:hover{background:var(--surface-2);color:var(--ink)}
.nv[aria-current="page"]{background:var(--jade-soft);color:var(--jade-ink);font-weight:600}
.nv[aria-current="page"] svg{opacity:1}
.nv .dot{margin-left:auto;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--clay);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;font-family:var(--f-d)}
.railfoot{margin-top:auto;font-size:11.5px;color:var(--ink-3);border-top:1px solid var(--line);padding-top:11px;display:flex;flex-direction:column;gap:4px}
.railfoot button{background:none;border:0;color:var(--ink-3);padding:0;font-size:11.5px;text-decoration:underline;text-underline-offset:2px}
main{flex:1;min-width:0}
.wrap{max-width:880px;padding:28px 30px 72px;margin:0 auto}
.topbar,.tabbar{display:none}

/* ============ avatars & status ============ */
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-d);font-size:10.5px;font-weight:600;color:#fff;flex:none}
.av.sm{width:21px;height:21px;font-size:9px}
.av.lg{width:34px;height:34px;font-size:13px}
.av.xl{width:46px;height:46px;font-size:16px}
.av.me{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--jade)}
.av.ghost{background:var(--surface-3)!important;color:var(--ink-3);border:1px dashed var(--line-2)}
.av.out{opacity:.45}
.sdot{width:7px;height:7px;border-radius:50%;flex:none;display:inline-block}
.sdot.home{background:var(--jade)}
.sdot.away{background:var(--ink-4)}
.sdot.incoming{background:var(--amber)}
.faces{display:flex;gap:5px}

/* ============ page furniture ============ */
.phead{margin-bottom:18px}
.phead h1{font-size:26px}
.phead p{margin-top:4px;color:var(--ink-2);font-size:14px;max-width:58ch}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 10px}
.sechead h2{font-size:12.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.sechead .sub{font-size:12.5px;color:var(--ink-3)}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--ink-3);font-size:13px;padding:0;margin-bottom:12px;font-weight:500}
.back:hover{color:var(--ink)}
.back svg{width:14px;height:14px}
.stack{display:flex;flex-direction:column;gap:11px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}

/* ============ house pulse ============ */
.pulse{border-radius:var(--r-lg);padding:18px 20px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);margin-bottom:12px}
.pulse.calm{background:linear-gradient(180deg,var(--jade-soft),var(--surface) 82%);border-color:var(--jade-line)}
.pulse.watch{background:linear-gradient(180deg,var(--amber-soft),var(--surface) 82%);border-color:var(--amber-line)}
.pulse .pl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:3px}
.pulse .pt{font-family:var(--f-d);font-size:21px;font-weight:600;line-height:1.35}
.pulse ul{margin:11px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.pulse ul li{font-size:13.5px;color:var(--ink-2);display:flex;gap:8px;align-items:flex-start;line-height:1.5}
.pulse ul li::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--amber);margin-top:8px;flex:none}
.glance{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px;padding-top:12px;border-top:1px solid var(--line)}
.gl{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:3px 11px}
.gl svg{width:13px;height:13px;opacity:.55}

.mstrip{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-bottom:14px}
.mcard{flex:1;min-width:134px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:11px 12px;display:flex;flex-direction:column;gap:7px;box-shadow:var(--shadow)}
.mcard.ghost{border-style:dashed;background:none;box-shadow:none}
.mcard .top{display:flex;align-items:center;gap:8px}
.mcard .nm{font-family:var(--f-d);font-weight:600;font-size:14px;line-height:1.2}
.mcard .rm{font-size:11px;color:var(--ink-3)}
.mcard .st{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:5px}
.mcard .st.dim{color:var(--ink-3)}

/* ============ todo cards ============ */
.todo{display:flex;gap:12px;padding:15px 16px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.todo .ic{width:33px;height:33px;border-radius:10px;flex:none;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2)}
.todo .ic svg{width:16px;height:16px}
.todo.a .ic{background:var(--jade-soft);color:var(--jade)}
.todo.b .ic{background:var(--amber-soft);color:var(--amber)}
.todo.c .ic{background:var(--clay-soft);color:var(--clay)}
.todo.d .ic{background:var(--slate-soft);color:var(--slate)}
.todo .bd{flex:1;min-width:0}
.todo .k{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.todo .t{font-family:var(--f-d);font-size:15.5px;font-weight:600;margin-top:2px;line-height:1.35}
.todo .m{font-size:13px;color:var(--ink-2);margin-top:2px;line-height:1.5}
.todo .act{margin-top:10px;display:flex;gap:7px;flex-wrap:wrap}
.todo.done{opacity:.6}
.todo.done .t{text-decoration:line-through;text-decoration-color:var(--ink-4)}

/* ============ butler ============ */
.butler{border:1px solid var(--jade-line);background:var(--surface);border-radius:var(--r);padding:14px 15px;box-shadow:var(--shadow)}
.butler .bh{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.butler .bh .bi{width:26px;height:26px;border-radius:8px;background:var(--jade);color:#fff;display:grid;place-items:center;flex:none}
.butler .bh .bi svg{width:14px;height:14px}
.butler .bh b{font-family:var(--f-d);font-size:14.5px;font-weight:600}
.butler .bh span{font-size:12px;color:var(--ink-3);margin-left:auto}
.binput{display:flex;gap:8px}
.binput input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--ground);color:var(--ink);font:inherit;font-size:14px}
.binput input:focus{outline:2px solid var(--jade);outline-offset:-1px;border-color:var(--jade)}
.bquick{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.bq{border:1px solid var(--line);background:var(--surface-2);border-radius:18px;padding:4px 11px;font-size:12.5px;color:var(--ink-2)}
.bq:hover{border-color:var(--jade-line);background:var(--jade-soft);color:var(--jade-ink)}

/* ============ feed ============ */
.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.feed li:last-child{border-bottom:0}
.feed .tx{flex:1;font-size:13.5px;color:var(--ink-2);line-height:1.5}
.feed .tx b{color:var(--ink);font-weight:600}
.feed .tm{font-size:11.5px;color:var(--ink-4);flex:none;font-variant-numeric:tabular-nums;padding-top:1px}
.feed .sysic{width:26px;height:26px;border-radius:50%;background:var(--surface-2);color:var(--ink-3);display:grid;place-items:center;flex:none}
.feed .sysic svg{width:13px;height:13px}

/* ============ pills / buttons ============ */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;border:1px solid transparent;white-space:nowrap;line-height:1.5}
.pill svg{width:12px;height:12px;flex:none}
.zone .zo svg{width:13px;height:13px;flex:none}
.ruleitem .rn svg{width:12px;height:12px}
.calcline .cl svg{width:14px;height:14px;flex:none;color:var(--ink-3)}
.opt svg{flex:none}
.pill.ok{background:var(--jade-soft);color:var(--jade-ink);border-color:var(--jade-line)}
.pill.warn{background:var(--amber-soft);color:var(--amber);border-color:var(--amber-line)}
.pill.hot{background:var(--clay-soft);color:var(--clay);border-color:var(--clay-line)}
.pill.info{background:var(--slate-soft);color:var(--slate);border-color:var(--slate-line)}
.pill.plain{background:var(--surface-2);color:var(--ink-3);border-color:var(--line)}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:7px 13px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .12s,border-color .12s;white-space:nowrap}
.btn:hover{background:var(--surface-2);border-color:var(--ink-4)}
.btn.pri{background:var(--jade);border-color:var(--jade);color:#fff}
.btn.pri:hover{background:var(--jade-ink);border-color:var(--jade-ink)}
.btn.ghost{border-color:transparent;background:var(--surface-2)}
.btn.danger{border-color:var(--clay-line);color:var(--clay);background:var(--clay-soft)}
.btn.danger:hover{background:var(--clay);color:#fff;border-color:var(--clay)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.wide{width:100%}
.btn svg{width:14px;height:14px;flex:none}
.btn[disabled]{opacity:.45;pointer-events:none}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:9px;overflow:hidden;background:var(--surface)}
.qty button{width:30px;height:29px;border:0;background:none;font-size:15px;line-height:1;color:var(--ink-2);display:grid;place-items:center}
.qty button:hover{background:var(--surface-2);color:var(--ink)}
.qty span{min-width:42px;text-align:center;font-family:var(--f-d);font-weight:600;font-size:13.5px;font-variant-numeric:tabular-nums;border-left:1px solid var(--line);border-right:1px solid var(--line);padding:3px 0}

/* ============ rows ============ */
.rows{display:flex;flex-direction:column}
.row{display:flex;gap:13px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0}
.row .ttl{font-family:var(--f-d);font-size:15px;font-weight:600;display:flex;align-items:center;gap:7px;flex-wrap:wrap;line-height:1.4}
.row .meta{font-size:12.5px;color:var(--ink-3);margin-top:2px;line-height:1.5}
.row .right{text-align:right;flex:none}
.row .amt{font-family:var(--f-d);font-size:16.5px;font-weight:600;font-variant-numeric:tabular-nums}
.row .per{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.row .cta{flex:none;display:flex;gap:6px}
.row.dim{opacity:.6}
.split{display:flex;gap:4px;margin-top:7px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);border-radius:20px;padding:2px 9px 2px 2px;font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}

/* ============ module entries ============ */
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:11px}
.mod{display:flex;gap:12px;align-items:flex-start;padding:14px 15px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);width:100%;transition:border-color .12s}
.mod:hover{border-color:var(--jade-line)}
.mod .mi{width:32px;height:32px;border-radius:10px;flex:none;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2)}
.mod .mi svg{width:16px;height:16px}
.mod .mn{font-family:var(--f-d);font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.mod .ms{font-size:12.5px;color:var(--ink-3);margin-top:2px;line-height:1.45}
.mod .flag{min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--clay);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;font-family:var(--f-d)}

.tonight{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:18px}
.tn{background:var(--surface);padding:12px 14px}
.tn .tl{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.tn .tv{font-family:var(--f-d);font-size:14.5px;font-weight:600;margin-top:3px;display:flex;align-items:center;gap:6px;line-height:1.35}
.tn .tsub{font-size:11.5px;color:var(--ink-3);margin-top:1px}

/* ============ supplies ============ */
.segbar{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;margin-bottom:14px;border:1px solid var(--line);flex-wrap:wrap}
.seg{border:0;background:none;padding:6px 13px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink-3)}
.seg[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(224px,1fr));gap:11px}
.sup{padding:14px 15px;display:flex;flex-direction:column;gap:10px}
.sup .head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.sup .nm{font-family:var(--f-d);font-size:15px;font-weight:600}
.sup .th{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.sup .bar{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.sup .bar i{display:block;height:100%;border-radius:3px;background:var(--jade);transform-origin:left center;transition:transform .3s}
.sup.low .bar i{background:var(--clay)}
.sup .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto}
.sup.low{border-color:var(--clay-line);box-shadow:var(--shadow),inset 3px 0 0 var(--clay)}
.sup .owner{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.sup .rulenote{font-size:12px;color:var(--ink-3);background:var(--surface-2);border-radius:8px;padding:6px 9px;line-height:1.45}

/* ============ spaces ============ */
.spgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:11px}
.space{padding:14px 15px}
.space h3{font-size:15px;display:flex;align-items:center;gap:7px;margin-bottom:10px}
.space h3 svg{width:15px;height:15px;color:var(--ink-3)}
.zones{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:11px;overflow:hidden}
.zone{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px;background:var(--surface)}
.zone:last-child{border-bottom:0}
.zone .zn{color:var(--ink-3);font-size:12px;min-width:44px}
.zone .zo{margin-left:auto;display:flex;align-items:center;gap:6px;font-weight:500}
.zone.mine{background:var(--jade-soft)}
.zone.mine .zn{color:var(--jade-ink)}
.zone.pub{background:var(--surface-2)}
.zone.handover{background:var(--amber-soft)}
.handnote{margin-top:9px;font-size:12px;color:var(--amber);background:var(--amber-soft);border:1px solid var(--amber-line);border-radius:9px;padding:7px 10px;line-height:1.45}

/* ============ fairness / ledger ============ */
.fair{border:1px solid var(--amber-line);background:var(--amber-soft);border-radius:var(--r);padding:14px 15px}
.fair .fh{display:flex;gap:8px;align-items:center;font-family:var(--f-d);font-weight:600;font-size:14.5px;color:var(--amber);margin-bottom:5px}
.fair .fh svg{width:15px;height:15px;flex:none}
.fair p{font-size:13.5px;color:var(--ink-2);line-height:1.55}
.calcbox{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-top:10px}
.calcline{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line)}
.calcline:last-child{border-bottom:0}
.calcline .cl{display:flex;align-items:center;gap:7px;color:var(--ink-2)}
.calcline .cv{font-family:var(--f-d);font-weight:600;font-variant-numeric:tabular-nums}
.calcline .cd{font-size:11.5px;color:var(--ink-3);margin-left:4px;font-weight:400}
.netrow{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.netrow:last-child{border-bottom:0}
.netrow .arrow{display:flex;align-items:center;gap:7px;flex:1;font-size:14px;flex-wrap:wrap}
.netrow .arrow svg{width:15px;height:15px;color:var(--ink-4);flex:none}
.netrow .amt{font-family:var(--f-d);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.notice{background:var(--surface-2);border-radius:11px;padding:10px 12px;font-size:12.5px;color:var(--ink-2);line-height:1.5;display:flex;gap:8px;align-items:flex-start}
.notice svg{width:14px;height:14px;flex:none;margin-top:3px;color:var(--ink-3)}

/* ============ consensus ============ */
.ruleitem{display:flex;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);align-items:flex-start}
.ruleitem:last-child{border-bottom:0}
.ruleitem .rn{width:22px;height:22px;border-radius:7px;background:var(--surface-2);color:var(--ink-3);font-family:var(--f-d);font-size:11px;font-weight:600;display:grid;place-items:center;flex:none;margin-top:1px}
.ruleitem .rb{flex:1;min-width:0}
.ruleitem .rt{font-size:14.5px;font-weight:600;font-family:var(--f-d);display:flex;gap:7px;align-items:center;flex-wrap:wrap;line-height:1.45}
.ruleitem .rd{font-size:12.5px;color:var(--ink-3);margin-top:2px;line-height:1.5}
.diffrow{padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.diffrow:last-child{border-bottom:0}
.diffrow .dt{font-family:var(--f-d);font-weight:600;font-size:14px;display:flex;align-items:center;gap:7px}
.vals{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.val{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:4px 10px 4px 4px;font-size:12.5px}
.val b{font-weight:600;font-family:var(--f-d)}
.suggest{margin-top:10px;background:var(--jade-soft);border:1px solid var(--jade-line);border-radius:11px;padding:10px 12px}
.suggest .sl{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--jade);font-weight:700}
.suggest p{font-size:13.5px;color:var(--jade-ink);margin-top:3px;line-height:1.5}

/* ============ stepper / quiz ============ */
.prog{display:flex;gap:4px;margin-bottom:18px}
.prog i{flex:1;height:3px;border-radius:2px;background:var(--surface-3)}
.prog i.on{background:var(--jade)}
.qnum{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.qtitle{font-family:var(--f-d);font-size:20px;font-weight:600;margin:5px 0 4px;line-height:1.35}
.qhint{font-size:13px;color:var(--ink-3);margin-bottom:16px;line-height:1.55}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:1px solid var(--line-2);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:14.5px;display:flex;align-items:center;gap:10px;transition:border-color .12s,background .12s;width:100%}
.opt:hover{border-color:var(--jade);background:var(--jade-soft)}
.opt[aria-pressed="true"]{border-color:var(--jade);background:var(--jade-soft);color:var(--jade-ink);font-weight:600}
.opt .ok{margin-left:auto;color:var(--jade);opacity:0;display:flex}
.opt[aria-pressed="true"] .ok{opacity:1}
.opt .ok svg{width:16px;height:16px}

.resgrp{border-radius:var(--r);border:1px solid var(--line);overflow:hidden;margin-bottom:12px}
.resgrp .gh{padding:11px 15px;font-family:var(--f-d);font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:8px}
.resgrp.agree .gh{background:var(--jade-soft);color:var(--jade-ink)}
.resgrp.talk .gh{background:var(--amber-soft);color:var(--amber)}
.resgrp .gh svg{width:16px;height:16px}
.resgrp .gb{background:var(--surface)}

/* ============ ladder ============ */
.ladder{display:flex;flex-direction:column;border-left:2px solid var(--line);margin-left:9px}
.lstep{position:relative;padding:9px 0 9px 22px;font-size:13.5px;color:var(--ink-3)}
.lstep::before{content:"";position:absolute;left:-7px;top:15px;width:11px;height:11px;border-radius:50%;background:var(--surface);border:2px solid var(--line-2)}
.lstep.on{color:var(--ink);font-weight:600}
.lstep.on::before{background:var(--jade);border-color:var(--jade)}
.lstep.past::before{background:var(--line-2);border-color:var(--line-2)}
.lstep small{display:block;font-weight:400;color:var(--ink-3);font-size:12px;margin-top:1px;line-height:1.5}

/* ============ safety ============ */
.safety{border:1px solid var(--clay-line);background:var(--clay-soft);border-radius:var(--r);padding:16px}
.safety h3{font-size:16px;color:var(--clay);display:flex;align-items:center;gap:8px}
.safety h3 svg{width:17px;height:17px;flex:none}
.safety p{font-size:13.5px;color:var(--ink-2);margin-top:7px;line-height:1.6}
.safeacts{display:flex;flex-direction:column;gap:7px;margin-top:13px}
.safeact{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px 13px;font-size:14px;font-weight:500;width:100%}
.safeact:hover{border-color:var(--clay)}
.safeact svg{width:16px;height:16px;color:var(--clay);flex:none}
.safeact .ar{margin-left:auto;color:var(--ink-4);display:flex}

/* ============ modal ============ */
.ov{position:fixed;inset:0;background:rgba(19,22,20,.5);backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;z-index:60;overflow-y:auto}
.ov[hidden]{display:none}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:20px;width:100%;max-width:452px;padding:20px;box-shadow:var(--shadow-lg);max-height:90vh;overflow-y:auto}
.sheet.wide{max-width:560px}
.sheet h3{font-size:18.5px;line-height:1.35}
.sheet .hint{color:var(--ink-3);font-size:13px;margin:4px 0 15px;line-height:1.55}
.sheet .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.fld{margin-bottom:13px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line-2);border-radius:10px;background:var(--ground);color:var(--ink);font:inherit;font-size:14.5px}
textarea{resize:vertical;min-height:80px;line-height:1.6}
input:focus,select:focus,textarea:focus{outline:2px solid var(--jade);outline-offset:-1px;border-color:var(--jade)}
.who-pick{display:flex;gap:7px;flex-wrap:wrap}
.who-pick button{border:1px solid var(--line-2);background:var(--ground);border-radius:20px;padding:4px 11px 4px 4px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500}
.who-pick button[aria-pressed="true"]{border-color:var(--jade);background:var(--jade-soft);color:var(--jade-ink);font-weight:600}

.understand{border:1px solid var(--line);border-radius:13px;overflow:hidden;margin-bottom:14px}
.understand .uh{background:var(--surface-2);padding:8px 12px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.understand .ub{padding:4px 12px}
.uline{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.uline:last-child{border-bottom:0}
.uline .ul{color:var(--ink-3);flex:none}
.uline .uv{font-weight:600;text-align:right;font-family:var(--f-d);display:flex;align-items:center;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.impact{background:var(--jade-soft);border:1px solid var(--jade-line);border-radius:12px;padding:11px 13px;margin-bottom:14px}
.impact .il{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--jade);font-weight:700;margin-bottom:5px}
.impact ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.impact ul li{font-size:13px;color:var(--jade-ink);display:flex;gap:7px;align-items:flex-start;line-height:1.5}
.impact ul li svg{width:13px;height:13px;flex:none;margin-top:4px}

.chk{display:flex;align-items:center;gap:11px;padding:11px 14px;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:0}
.chk .box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line-2);flex:none;display:grid;place-items:center;background:var(--surface)}
.chk.on .box{background:var(--jade);border-color:var(--jade);color:#fff}
.chk .box svg{width:12px;height:12px;opacity:0}
.chk.on .box svg{opacity:1}
.chk .ct{flex:1;font-size:14px}
.chk.on .ct{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--ink-4)}
.chk .cm{font-size:12px;color:var(--ink-3);flex:none}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:30px;background:var(--ink);color:var(--ground);padding:11px 18px;border-radius:22px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow-lg);z-index:80;max-width:86vw;text-align:center;line-height:1.5}
.toast[hidden]{display:none}
.empty{padding:26px;text-align:center;color:var(--ink-3);font-size:13.5px;line-height:1.6}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ============ mobile ============ */
@media (max-width:880px){
  .rail{display:none}
  .shell{flex-direction:column}
  .topbar{display:flex;align-items:center;gap:9px;padding:10px 15px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:25}
  .topbar .hn{font-family:var(--f-d);font-weight:600;font-size:14.5px;line-height:1.25;display:block}
  .topbar .ho{font-size:11px;color:var(--ink-3);display:block}
  .topbar .faces{margin-left:auto}
  .wrap{padding:16px 15px 100px}
  .phead h1{font-size:22px}
  .pulse .pt{font-size:19px}
  .mods{grid-template-columns:1fr 1fr}
  .mod{flex-direction:column;gap:9px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);padding:5px 4px calc(5px + env(safe-area-inset-bottom));z-index:40}
  .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;font-size:10.5px;color:var(--ink-3);font-weight:500;position:relative}
  .tabbar button svg{width:20px;height:20px}
  .tabbar button[aria-current="page"]{color:var(--jade)}
  .tabbar .dot{position:absolute;top:2px;right:calc(50% - 17px);min-width:15px;height:15px;border-radius:8px;background:var(--clay);color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center;font-family:var(--f-d)}
  .row{flex-wrap:wrap}
  .row .cta{width:100%;margin-top:4px}
  .row .cta .btn{flex:1}
  .toast{bottom:86px}
  .tonight{grid-template-columns:1fr 1fr}
}
@media (max-width:430px){ .mods{grid-template-columns:1fr} .tonight{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="brand">
      <span class="mark" id="markA"></span>
      <span><b>合租生活管家</b><span>让不同的人舒服地住在一起</span></span>
    </div>
    <div class="housecard">
      <div class="hl">当前 House</div>
      <div class="hn" id="hName"></div>
      <div class="ho" id="hOrg"></div>
      <div class="roster" id="roster"></div>
    </div>
    <nav id="nav"></nav>
    <div class="railfoot">
      <span>当前身份 <b id="meName"></b></span>
      <button data-act="reset">重置演示数据</button>
    </div>
  </aside>
  <main>
    <header class="topbar">
      <span class="mark" id="markB"></span>
      <span><span class="hn" id="hNameM"></span><span class="ho" id="hOrgM"></span></span>
      <div class="faces" id="topFaces"></div>
    </header>
    <div class="wrap" id="view"></div>
  </main>
</div>
<div class="tabbar" id="tabbar"></div>
<div class="ov" id="ov" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="对话框"></div></div>
<div class="toast" id="toast" hidden></div>

<script src="js/data.js"></script>
<script src="js/views.js"></script>
<script src="js/flows.js"></script>
<script src="js/app.js"></script>
</body>
</html>
