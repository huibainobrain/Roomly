<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roomly · 望京西园三区 503</title>
<meta name="description" content="陌生人共同生活的协调系统：把边界说清楚，让系统处理不值得开口的小事。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* ============ tokens ============ */
:root{
  --ground:#F6F5F1; --surface:#FFFFFF; --surface-2:#F0EFE9; --surface-3:#E8E7DF;
  --ink:#1B201D; --ink-2:#4C5752; --ink-3:#87908A; --ink-4:#A8B0AA;
  --line:#E3E1D9; --line-2:#D1CFC5;
  --jade:#2A7059; --jade-ink:#1F5B47; --jade-soft:#E2EFE9; --jade-line:#B7D8C8;
  --amber:#A3651E; --amber-soft:#F8EBD9; --amber-line:#E8CEA8;
  --clay:#AC4C38; --clay-soft:#F8E5E0; --clay-line:#E6C0B6;
  --slate:#3F5F80; --slate-soft:#E4EBF2; --slate-line:#BDCEE0;
  --shadow:0 1px 2px rgba(27,32,29,.045), 0 8px 22px -14px rgba(27,32,29,.2);
  --shadow-lg:0 20px 48px -20px rgba(27,32,29,.32);
  --r:16px; --r-lg:20px;
  --f-d:"Outfit","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --f-b:"Instrument Sans","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  /* 首页专用的暖色层：奶油白底、鼠尾草绿主色、少量橙与浅蓝作状态点缀 */
  --cream:#FCF8F1; --sand:#F5EDE0; --sand-2:#EFE4D2;
  --sage:#6E9E7F; --sage-deep:#3D6B52; --sage-soft:#E7F0E7; --sage-line:#CBE0CD;
  --peach:#D08A46; --peach-soft:#FBEEDF;
  --sky:#6E9BBC; --sky-soft:#E7F0F6;
  --rose:#C4776B; --rose-soft:#FAE9E5;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#131614; --surface:#1B1F1C; --surface-2:#232825; --surface-3:#2C322E;
  --ink:#ECEEEA; --ink-2:#ADB6B0; --ink-3:#7A837D; --ink-4:#636C66;
  --line:#2B312C; --line-2:#3A413B;
  --jade:#6FC5A0; --jade-ink:#91DAB9; --jade-soft:#1A2E25; --jade-line:#2D4C3E;
  --amber:#DCA765; --amber-soft:#2D2418; --amber-line:#483A23;
  --clay:#DE8873; --clay-soft:#321F1A; --clay-line:#4B2E26;
  --slate:#8FB2D6; --slate-soft:#1B242E; --slate-line:#2E3D4D;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 22px -14px rgba(0,0,0,.6);
  --shadow-lg:0 20px 48px -20px rgba(0,0,0,.7);
  --cream:#1A1E1B; --sand:#232823; --sand-2:#2B312C;
  --sage:#7FBE96; --sage-deep:#9AD3AE; --sage-soft:#1C2E22; --sage-line:#2F4A38;
  --peach:#DDA36B; --peach-soft:#2D2318;
  --sky:#8CB4CE; --sky-soft:#1B2630;
  --rose:#D9948A; --rose-soft:#2E1F1D;
}}
:root[data-theme="dark"]{
  --ground:#131614; --surface:#1B1F1C; --surface-2:#232825; --surface-3:#2C322E;
  --ink:#ECEEEA; --ink-2:#ADB6B0; --ink-3:#7A837D; --ink-4:#636C66;
  --line:#2B312C; --line-2:#3A413B;
  --jade:#6FC5A0; --jade-ink:#91DAB9; --jade-soft:#1A2E25; --jade-line:#2D4C3E;
  --amber:#DCA765; --amber-soft:#2D2418; --amber-line:#483A23;
  --clay:#DE8873; --clay-soft:#321F1A; --clay-line:#4B2E26;
  --slate:#8FB2D6; --slate-soft:#1B242E; --slate-line:#2E3D4D;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 22px -14px rgba(0,0,0,.6);
  --shadow-lg:0 20px 48px -20px rgba(0,0,0,.7);
  --cream:#1A1E1B; --sand:#232823; --sand-2:#2B312C;
  --sage:#7FBE96; --sage-deep:#9AD3AE; --sage-soft:#1C2E22; --sage-line:#2F4A38;
  --peach:#DDA36B; --peach-soft:#2D2318;
  --sky:#8CB4CE; --sky-soft:#1B2630;
  --rose:#D9948A; --rose-soft:#2E1F1D;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-b);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-d);margin:0;text-wrap:balance;letter-spacing:-.012em;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px;border-radius:7px}
.num{font-family:var(--f-d);font-variant-numeric:tabular-nums}

/* ============ shell ============ */
.shell{display:flex;min-height:100vh}
.rail{width:244px;flex:none;border-right:1px solid var(--line);background:var(--surface);padding:22px 15px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center}
.mark{width:34px;height:34px;flex:none;border-radius:11px;background:var(--jade);color:#fff;display:grid;place-items:center}
.mark svg{width:18px;height:18px}
.brand b{font-family:var(--f-d);font-size:18px;font-weight:700;letter-spacing:-.01em;display:block;line-height:1.25}
.brand span span{font-size:11px;color:var(--ink-3)}
.housecard{background:var(--surface-2);border-radius:13px;padding:11px 12px}
.housecard .hl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.housecard .hn{font-family:var(--f-d);font-weight:600;font-size:14px;margin-top:1px;line-height:1.35}
.housecard .ho{font-size:11.5px;color:var(--ink-3);margin-top:3px}
/* 侧栏只放头像，成员状态在首页的状态栏里说，不两处重复 */
.roster{display:flex;gap:5px;margin-top:9px;align-items:center;flex-wrap:wrap}
.roster .rmore{font-size:11px;color:var(--ink-3);margin-left:2px;width:100%;line-height:1.4}
nav{display:flex;flex-direction:column;gap:2px}
.nv{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;border:0;background:none;width:100%;color:var(--ink-2);font-weight:500;font-size:14.5px}
.nv svg{width:17px;height:17px;flex:none;opacity:.7}
.nv:hover{background:var(--surface-2);color:var(--ink)}
.nv[aria-current="page"]{background:var(--jade-soft);color:var(--jade-ink);font-weight:600}
.nv[aria-current="page"] svg{opacity:1}
.nv .dot{margin-left:auto;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--clay);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;font-family:var(--f-d)}
.railfoot{margin-top:auto;border-top:1px solid var(--line);padding-top:10px;position:relative}
.idbtn{display:flex;align-items:center;gap:5px;width:100%;background:none;border:0;padding:4px 0;
  font-size:12px;color:var(--ink-3)}
.idbtn b{font-weight:600;color:var(--ink-2)}
.idbtn:hover{color:var(--ink-2)}
.demopanel{position:absolute;bottom:calc(100% + 6px);left:0;right:0;background:var(--surface);
  border:1px solid var(--line);border-radius:11px;padding:11px 12px;box-shadow:var(--shadow-lg);z-index:10}
.demopanel p{font-size:11.5px;color:var(--ink-3);line-height:1.5;margin-bottom:8px}
.demopanel button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;
  padding:5px 10px;font-size:12px;color:var(--ink-2);width:100%;margin-top:5px}
.demopanel button:hover{border-color:var(--ink-4);color:var(--ink)}
.idlist{display:flex;flex-direction:column;gap:3px;margin-bottom:7px}
.idlist button{display:flex;align-items:center;gap:7px;width:100%;background:none;border:1px solid transparent;
  border-radius:8px;padding:5px 7px;font-size:12.5px;color:var(--ink-2);margin:0}
.idlist button[aria-pressed="true"]{background:var(--jade-soft);border-color:var(--jade-line);color:var(--jade-ink);font-weight:600}
.idlist button small{margin-left:auto;font-size:11px;color:var(--ink-4);font-weight:400}
main{flex:1;min-width:0}
.wrap{max-width:880px;padding:28px 30px 72px;margin:0 auto}
/* 作品说明条：一眼能看到"4 小时搭建"和"数据会重置" */
.aboutband{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 22px;background:var(--cream);border-bottom:1px solid var(--sand-2);font-size:12.5px;color:var(--ink-2);line-height:1.5}
.ab-tag{display:inline-flex;align-items:center;background:var(--peach);color:#fff;font-weight:700;font-size:12px;letter-spacing:.02em;border-radius:999px;padding:3px 10px;white-space:nowrap}
.ab-text b{color:var(--ink);font-weight:600}
.ab-sep{color:var(--ink-4)}
.ab-link{margin-left:auto;color:var(--sage-deep);font-weight:600;text-decoration:none;white-space:nowrap}
.ab-link:hover{text-decoration:underline}
@media (max-width:760px){
  .aboutband{padding:9px 14px;gap:6px;font-size:12px}
  .ab-sep{display:none}
  .ab-link{margin-left:0}
}
.topbar,.tabbar{display:none}

/* ============ avatars & status ============ */
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-d);font-size:10.5px;font-weight:600;color:#fff;flex:none;position:relative;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%}
.av.xxl{width:56px;height:56px;font-size:19px}
.av.sm{width:21px;height:21px;font-size:9px}
.av.lg{width:34px;height:34px;font-size:13px}
.av.xl{width:46px;height:46px;font-size:16px}
.av.me{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--jade)}
.av.ghost{background:var(--surface-3)!important;color:var(--ink-3);border:1px dashed var(--line-2)}
.av.out{opacity:.45}
.sdot{width:7px;height:7px;border-radius:50%;flex:none;display:inline-block}
.sdot.home{background:var(--jade)}
.sdot.away{background:var(--ink-4)}
.sdot.incoming{background:var(--amber)}
.faces{display:flex;gap:5px}

/* ============ page furniture ============ */
.phead{margin-bottom:18px}
.phead h1{font-size:26px}
.phead p{margin-top:4px;color:var(--ink-2);font-size:14px;max-width:58ch}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 10px}
.sechead h2{font-size:12.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.sechead .sub{font-size:12.5px;color:var(--ink-3)}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--ink-3);font-size:13px;padding:0;margin-bottom:12px;font-weight:500}
.back:hover{color:var(--ink)}
.back svg{width:14px;height:14px}
.stack{display:flex;flex-direction:column;gap:11px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}

/* ============================================================
   首页
   图片位统一用 .ph：图片加载成功后补 .ok 收起占位说明，加载失败则 <img>
   自行移除、露出占位说明。区域尺寸和比例由 aspect-ratio 固定，两种情况都不塌陷。
   ============================================================ */
.ph{position:relative;margin:0;border-radius:var(--r);overflow:hidden;background:var(--sand);
  border:1px solid var(--sand-2);display:grid;place-items:center;min-height:60px}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ph figcaption{font-size:11.5px;color:var(--ink-4);letter-spacing:.04em;text-align:center;
  padding:8px 12px;line-height:1.5;position:relative;z-index:0}
.ph.ok{background:none;border-color:transparent}
.ph.ok figcaption{display:none}
.ph::after{content:"";position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.02)}

/* 侧栏底部的家居氛围图 */
.railart{margin-top:14px}
.railart .ph{aspect-ratio:5/4;border-radius:14px}

/* 首页用更宽的版心，其他页面不受影响 */
.wrap.wide{max-width:1160px}

/* ---- 欢迎横幅 ---- */
.welcome{display:grid;grid-template-columns:minmax(260px,1fr) 1.15fr;gap:0;align-items:stretch;
  background:linear-gradient(120deg,var(--sage-soft),var(--cream) 70%);
  border:1px solid var(--sage-line);border-radius:24px;overflow:hidden;margin-bottom:16px}
.welcome .wl-text{padding:22px 26px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.welcome h1{font-size:26px;font-weight:600;line-height:1.25;color:var(--sage-deep)}
.welcome p{font-size:14px;color:var(--ink-2);max-width:30ch;line-height:1.55}
.welcome .wl-meta{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.welcome .ph{border:0;border-radius:0;aspect-ratio:auto;background:var(--sand-2);min-height:142px}

/* ---- 主栅格：两张卡等高，下面不留空档 ---- */
.hgrid{display:grid;grid-template-columns:1.02fr .98fr;gap:16px;margin-bottom:16px;align-items:stretch}
.hgrid2{display:grid;grid-template-columns:1.45fr .8fr;gap:16px;align-items:start}

/* ---- 住所概览 ---- */
.place{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px 22px;
  box-shadow:var(--shadow);display:flex;flex-direction:column}
.place .ptop{display:flex;align-items:center;gap:8px}
.place h2{font-size:19px;font-weight:600}
.place .pmeta{display:flex;flex-wrap:wrap;gap:5px 16px;font-size:12.5px;color:var(--ink-3);margin-top:6px}
.place .pmeta span{display:inline-flex;align-items:center;gap:5px}
.place .pmeta svg{width:13px;height:13px;opacity:.6}
/* 成员向左紧凑排列，不平摊整行宽度 */
.people{display:flex;gap:4px;margin-top:auto;padding-top:16px;flex-wrap:wrap;justify-content:flex-start}
.person{flex:0 0 auto;min-width:84px;display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:9px 6px;border-radius:16px;transition:background .15s}
.person:hover{background:var(--sage-soft)}
.person .pn{font-family:var(--f-d);font-weight:600;font-size:13.5px;line-height:1.2;text-align:center}
.person .pr{font-size:11px;color:var(--ink-4)}
.person .pst{font-size:11.5px;display:flex;align-items:center;gap:4px;color:var(--ink-3);white-space:nowrap}
.person.me .pn{color:var(--sage-deep)}

/* ---- 今天，家里怎么样（首页主卡）
   文字在左、氛围图在右：素材左侧本来就是整片绿墙，裁掉后正好只剩沙发和猫。
   横向排布让这张卡和左边的住所卡高度接近，不再在下方留出空档。 ---- */
.mood{background:var(--sage-soft);border:1px solid var(--sage-line);border-radius:22px;overflow:hidden;
  box-shadow:var(--shadow);display:grid;grid-template-columns:1fr minmax(140px,.58fr)}
.mood .mbody{padding:20px 8px 20px 22px;display:flex;flex-direction:column;justify-content:center}
.mood .ph{border:0;border-radius:0;aspect-ratio:auto;background:var(--sage-soft);min-height:0}
.mood .ph img{object-position:74% 50%}
.mood .ml{font-size:11.5px;letter-spacing:.1em;color:var(--sage);font-weight:700}
.mood h2{font-size:21px;font-weight:600;margin-top:5px;line-height:1.3;color:var(--sage-deep)}
.mood .mtags{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.mood .mtags span{font-size:12.5px;font-weight:500;color:var(--peach);background:var(--peach-soft);
  border-radius:9px;padding:4px 10px}
.mood .mglance{display:flex;flex-direction:column;gap:7px;margin-top:14px;padding-top:12px;
  border-top:1px solid var(--sage-line)}
.mood .mglance span{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2)}
.mood .mglance svg{width:13px;height:13px;opacity:.55}

/* ---- 今日待办：小事的感觉，不是工单。
   图标与文案同排、按钮统一贴底，四张卡在一行里高度一致，页面不被撑长。
   中文文案比效果图长不少，四列并排会挤成每行八个字，所以走两列。 ---- */
.todos{display:grid;grid-template-columns:1fr 1fr;gap:11px;align-items:stretch}
.tcard{border-radius:18px;padding:14px 15px;display:grid;grid-template-columns:34px 1fr;
  grid-template-rows:auto 1fr;column-gap:11px;row-gap:9px;border:1px solid transparent}
.tcard.a{background:var(--sage-soft);border-color:var(--sage-line)}
.tcard.b{background:var(--peach-soft);border-color:#EFDCC4}
.tcard.c{background:var(--sky-soft);border-color:#CFE0EC}
.tcard.d{background:var(--rose-soft);border-color:#EFD5CF}
.tcard .tic{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:var(--surface)}
.tcard .tic svg{width:17px;height:17px}
.tcard.a .tic{color:var(--sage-deep)} .tcard.b .tic{color:var(--peach)}
.tcard.c .tic{color:var(--sky)}       .tcard.d .tic{color:var(--rose)}
.tcard .tt{font-family:var(--f-d);font-size:14.5px;font-weight:600;line-height:1.35}
.tcard .ts{font-size:12px;color:var(--ink-2);line-height:1.5;margin-top:3px}
.tcard .tb{grid-column:2;align-self:end;display:flex;gap:6px;flex-wrap:wrap}
.tcard .tb .btn.sm{padding:5px 10px;font-size:12.5px}
.tcard .tb .btn{background:var(--surface);border-color:transparent;box-shadow:var(--shadow)}
.tcard.a .tb .btn.pri{background:var(--sage);border-color:var(--sage)}
.tcard.b .tb .btn.pri{background:var(--peach);border-color:var(--peach)}
.tcard.c .tb .btn.pri{background:var(--sky);border-color:var(--sky)}
.tcard.d .tb .btn.pri{background:var(--rose);border-color:var(--rose)}

/* ---- 跟管家说一句 ---- */
.butler2{background:var(--surface);border:1px solid var(--sage-line);border-radius:20px;
  padding:16px 18px;margin-top:16px;box-shadow:var(--shadow)}
.butler2 .b2h{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.butler2 .b2i{width:34px;height:34px;border-radius:12px;background:var(--sage-soft);color:var(--sage-deep);
  display:grid;place-items:center;flex:none}
.butler2 .b2i svg{width:18px;height:18px}
.butler2 .b2h b{font-family:var(--f-d);font-size:15px;font-weight:600;display:block}
.butler2 .b2h span{font-size:12px;color:var(--ink-3)}
.b2in{display:flex;gap:9px;align-items:center;background:var(--cream);border:1px solid var(--line);
  border-radius:14px;padding:5px 5px 5px 14px}
.b2in input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:14px;color:var(--ink);padding:8px 0}
.b2in input:focus{outline:none}
.b2in button{width:38px;height:38px;border-radius:12px;background:var(--sage);color:#fff;border:0;
  display:grid;place-items:center;flex:none}
.b2in button:hover{background:var(--sage-deep)}
.b2in button svg{width:17px;height:17px}
.b2q{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.b2q button{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 12px;
  font-size:12.5px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.b2q button svg{width:13px;height:13px;opacity:.6}
.b2q button:hover{border-color:var(--sage-line);background:var(--sage-soft);color:var(--sage-deep)}

/* ---- 家里动态 ---- */
.stream{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:6px 18px 12px;
  box-shadow:var(--shadow)}
.stream li{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px dashed var(--line)}
.stream li:last-child{border-bottom:0}
.stream .sic{width:28px;height:28px;border-radius:10px;display:grid;place-items:center;flex:none;
  background:var(--sage-soft);color:var(--sage-deep)}
.stream .sic svg{width:14px;height:14px}
.stream .stx{flex:1;font-size:13.5px;color:var(--ink-2);line-height:1.5}
.stream .stx b{color:var(--ink);font-weight:600}
.stream .stm{font-size:11.5px;color:var(--ink-4);margin-top:2px}

/* ---- 底部生活方式横幅 ---- */
.lifeband{position:relative;margin-top:18px;border-radius:22px;overflow:hidden;
  border:1px solid var(--sand-2);background:var(--sand)}
.lifeband .ph{border:0;border-radius:0;aspect-ratio:auto;min-height:126px;background:var(--sand)}
.lifeband .ph figcaption{position:absolute;top:12px;left:0;right:0}
.lifeband .lbtext{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:20px;pointer-events:none}
.lifeband .lbtext p{font-family:var(--f-d);font-size:17.5px;font-weight:600;color:var(--sage-deep);
  text-align:center;max-width:30ch;line-height:1.5;text-shadow:0 1px 12px rgba(252,248,241,.85)}

@media (max-width:1080px){
  .hgrid,.hgrid2{grid-template-columns:1fr}
  .welcome{grid-template-columns:1fr}
  .welcome .ph{min-height:150px;order:-1}
  /* 单栏后主卡变宽，三条概览横排更省高度 */
  .mood .mglance{flex-direction:row;flex-wrap:wrap;gap:6px 18px}
}
@media (max-width:560px){
  .todos{grid-template-columns:1fr}
  .people{display:grid;grid-template-columns:1fr 1fr;gap:4px}
  .person{min-width:0}
  .welcome .wl-text{padding:22px 20px}
  .welcome h1{font-size:25px}
  .lifeband .lbtext p{font-size:16.5px}
  /* 窄屏把主卡改回上图下文，右侧窄栏会把画面裁得太碎 */
  .mood{grid-template-columns:1fr}
  .mood .ph{aspect-ratio:16/9;order:-1}
  .mood .ph img{object-position:50% 50%}
  .mood .mbody{padding:18px 20px 20px}
}

/* ============================================================
   生活页
   顶部一行身份 → 欢迎横幅 → 三栏日程 + 一张氛围卡 → 八张模块卡 → 底部横幅。
   模块卡按内容分四种底色，不再是八个一样的白框；照片类区域用 .ph 预留。
   ============================================================ */
.lifetop{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px}
.lifetop h1{font-size:24px;font-weight:600;color:var(--sage-deep)}
.lifetop p{font-size:13.5px;color:var(--ink-3);margin-top:2px}
.ltme{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:5px 15px 5px 5px;box-shadow:var(--shadow);font-size:12px;color:var(--ink-3);flex:none}
.ltme b{display:block;font-family:var(--f-d);font-size:13.5px;color:var(--ink);font-weight:600;line-height:1.2}

/* ---- 欢迎横幅：文字在左、氛围图在右 ---- */
.lwelcome{display:grid;grid-template-columns:minmax(300px,1fr) 1.25fr;align-items:stretch;
  background:linear-gradient(115deg,var(--sage-soft),var(--cream) 75%);border:1px solid var(--sage-line);
  border-radius:24px;overflow:hidden;margin-bottom:4px}
.lw-text{position:relative;padding:26px 30px;display:flex;flex-direction:column;justify-content:center;gap:8px}
/* 「不好开口」入口放在横幅文字栏右上角：白色药丸、鼠尾草绿字 */
.lw-cta{position:absolute;top:16px;right:18px;display:inline-flex;align-items:center;gap:6px;
  background:var(--surface);border:1px solid var(--sage-line);border-radius:999px;padding:7px 14px 7px 11px;
  font-size:12.5px;font-weight:600;color:var(--sage-deep);box-shadow:var(--shadow);white-space:nowrap}
.lw-cta svg{width:14px;height:14px;opacity:.85}
.lw-cta:hover{background:var(--sage-soft);border-color:var(--sage)}
.lw-text h2{font-size:24px;font-weight:600;line-height:1.35;color:var(--sage-deep)}
.lw-text p{font-size:14px;color:var(--ink-2)}
.lwelcome .ph{border:0;border-radius:0;aspect-ratio:auto;min-height:152px;background:var(--sand-2)}
.lwelcome .ph img{object-position:50% 28%}   /* 素材是 3:1，横幅更扁，往上取景保住右上角的手写字 */

/* ---- 日程：今天 / 明天 / 接下来 三栏，加一张氛围卡 ---- */
.agenda{display:grid;grid-template-columns:1fr 1fr 1fr .92fr;gap:12px;align-items:stretch}
.agcol{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 16px 10px;box-shadow:var(--shadow)}
.agcol:first-child{background:var(--cream);border-color:var(--sand-2)}
.agh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
.agh b{font-family:var(--f-d);font-size:16px;font-weight:600}
.agh span{font-size:12px;color:var(--ink-3)}
.agcol ul{list-style:none;margin:0;padding:0}
.ag{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px dashed var(--line)}
.ag:first-child{border-top:0}
.agm{width:18px;height:18px;flex:none;margin-top:2px;border-radius:50%;display:grid;place-items:center}
.agm.chk{border:1.5px solid var(--line-2);background:var(--surface);cursor:pointer;padding:0}
.agm.chk:hover{border-color:var(--sage)}
.agm.chk.on{background:var(--sage);border-color:var(--sage);color:#fff}
.agm.chk.on svg{width:11px;height:11px}
.agm.dot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink-4)}
.agm.dot.sky::before{background:var(--sky)}
.agm.dot.sage::before{background:var(--sage)}
.agm.dot.peach::before{background:var(--peach)}
.agb{min-width:0}
.agt{font-family:var(--f-d);font-size:13.5px;font-weight:600;line-height:1.35}
.ags{font-size:12px;color:var(--ink-3);margin-top:1px;line-height:1.45}
.ag.done .agt{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--ink-4)}
.ag.muted{opacity:.6}
.ag.none{color:var(--ink-4);font-size:12.5px;padding:10px 0}

/* 氛围卡：照片做底，文案和按钮压在下沿；没图时按主题色显示 */
.agmoment{position:relative;border-radius:20px;overflow:hidden;background:var(--sand);border:1px solid var(--sand-2);
  min-height:220px;display:flex;align-items:flex-end}
.agmoment .ph{position:absolute;inset:0;border:0;border-radius:0;aspect-ratio:auto;min-height:0}
.agmoment .ph figcaption{position:absolute;top:14px;left:0;right:0}
.agmt{position:relative;z-index:1;padding:14px 16px 16px;width:100%;color:var(--sage-deep)}
.agmt p{font-family:var(--f-d);font-size:14.5px;font-weight:600;line-height:1.5;margin-bottom:10px;color:inherit}
.agmt .btn{background:var(--surface);border-color:transparent;box-shadow:var(--shadow)}
.agmoment:has(.ph.ok) .agmt{background:linear-gradient(180deg,transparent,rgba(252,248,241,.94) 42%);color:#3D6B52}
.agmoment:has(.ph.ok) .agmt .btn{background:#fff;color:#3D6B52}

/* ---- 八张模块卡：四种底色分组，不是八个一样的白框 ---- */
.lcards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.lc{border-radius:20px;padding:15px 16px 13px;display:flex;flex-direction:column;gap:7px;border:1px solid transparent;min-height:190px}
.lc.cream{background:var(--surface);border-color:var(--line);box-shadow:var(--shadow)}
.lc.sand{background:var(--cream);border-color:var(--sand-2)}
.lc.sage{background:var(--sage-soft);border-color:var(--sage-line)}
.lc.sky{background:var(--sky-soft);border-color:color-mix(in srgb,var(--sky) 32%,transparent)}
.lc.peach{background:var(--peach-soft);border-color:color-mix(in srgb,var(--peach) 28%,transparent)}
.lc header{display:flex;align-items:center;gap:9px}
.lc header h3{font-size:15px;font-weight:600;flex:1}
.lci{width:34px;height:34px;border-radius:12px;background:var(--surface);display:grid;place-items:center;color:var(--ink-2);flex:none;box-shadow:var(--shadow)}
.lci svg{width:17px;height:17px}
.lc.sage .lci{color:var(--sage-deep)} .lc.sky .lci{color:var(--sky)}
.lc.peach .lci,.lc.sand .lci{color:var(--peach)}
.lcflag{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--rose);color:#fff;font-size:10.5px;
  font-weight:700;font-style:normal;display:grid;place-items:center;font-family:var(--f-d)}
.lclist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.lclist li{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;padding:6px 0;border-top:1px dashed var(--line)}
.lclist li:first-child{border-top:0}
.lclist li>span:not(.av):first-child{color:var(--ink-2)}
.lclist b{font-weight:600;font-family:var(--f-d);color:var(--ink)}
.lclist b.hot{color:var(--rose)} .lclist b.warm{color:var(--peach)}
.lclist.lend li{justify-content:flex-start}
.lclist.lend li>span:not(.av){flex:1;min-width:0;display:flex;flex-direction:column;color:var(--ink);font-weight:600;font-family:var(--f-d)}
.lclist.lend em,.lclist.svc em{font-style:normal;font-size:11.5px;color:var(--ink-3);font-weight:400;font-family:var(--f-b);display:block;line-height:1.4}
.lclist.lend b{font-size:12px;color:var(--ink-3);font-weight:500}
.lclist.svc li{justify-content:flex-start;align-items:flex-start}
.lclist.svc li>span:first-child{width:28px;height:28px;border-radius:9px;background:var(--surface);display:grid;place-items:center;color:var(--peach);flex:none;margin-top:1px}
.lclist.svc li>span:first-child svg{width:14px;height:14px}
.lclist.svc li>span:last-child{font-weight:600;font-family:var(--f-d);color:var(--ink);min-width:0}
.lcbig{font-family:var(--f-d);font-size:16px;font-weight:600;display:flex;align-items:center;gap:7px;line-height:1.3}
.lcsub{font-size:12.5px;color:var(--ink-2);line-height:1.45}
.lcnote{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px;line-height:1.4}
.lcnote b{color:var(--peach);font-weight:600}
.lcnote.warm{color:var(--peach);font-weight:500}
.lcnote .avs{display:inline-flex;flex:none}
.lcnote .avs .av{margin-left:-5px;box-shadow:0 0 0 2px var(--sage-soft)}
.lcnote .avs .av:first-child{margin-left:0}
.lc footer{margin-top:auto;padding-top:8px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.lc footer .btnrow{margin:0}
.lcgo{margin-left:auto;display:inline-flex;align-items:center;gap:1px;background:none;border:0;padding:4px 0;
  font-size:12.5px;color:var(--sage-deep);font-weight:600;white-space:nowrap}
.lcgo svg{width:14px;height:14px}
.lcgo:hover{text-decoration:underline}
.sechead .lcgo{margin-left:0}
.sdot.in,.sdot.free{background:var(--sage)}
.sdot.busy{background:var(--sky)}

/* 访客头像行：主人是成员头像，访客是预留的图片位，最后一个是登记入口 */
.gavs{display:flex;align-items:center;margin:2px 0 4px}
.gavs .av{margin-left:-8px;box-shadow:0 0 0 2px var(--sky-soft)}
.gavs .av:first-child{margin-left:0}
.av.gav{width:34px;height:34px;font-size:12px;background:var(--sand-2);color:var(--ink-3)}
.av.gav.add{border:1.5px dashed var(--line-2);background:var(--surface);color:var(--ink-3);cursor:pointer;padding:0}
.av.gav.add svg{width:14px;height:14px}
.av.gav.add:hover{border-color:var(--sage);color:var(--sage-deep)}

/* 在住 / 离家 的成员一行 */
.lpeople{display:flex;gap:2px;flex-wrap:wrap;margin:2px 0}
.lp{flex:1;min-width:56px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.lp b{font-family:var(--f-d);font-size:12px;font-weight:600;line-height:1.2}
.lp span{font-size:10.5px;color:var(--ink-3);white-space:nowrap}
.lp.away span,.lp.incoming span{color:var(--peach)}

/* ---- 底部横幅：文案在左、入口在右，照片做底 ---- */
.lband{position:relative;margin-top:18px;border-radius:22px;overflow:hidden;border:1px solid var(--sand-2);background:var(--sand)}
.lband .ph{border:0;border-radius:0;aspect-ratio:auto;min-height:132px}
.lband .ph img{object-position:50% 56%}   /* 取猫和沙发那一条 */
.lband .ph figcaption{position:absolute;top:12px;left:0;right:0}
.lband .lbt{position:absolute;inset:0;display:flex;align-items:center;padding:20px 28px}
.lband .lbt p{font-family:var(--f-d);font-size:16.5px;font-weight:600;color:var(--sage-deep);max-width:34ch;line-height:1.5}
.lband:has(.ph.ok) .lbt p{color:#3D6B52;text-shadow:0 1px 14px rgba(252,248,241,.9)}

@media (max-width:1080px){
  .agenda{grid-template-columns:1fr 1fr}
  .lcards{grid-template-columns:1fr 1fr}
  .lwelcome{grid-template-columns:1fr}
  .lwelcome .ph{min-height:150px;order:-1}
  .lw-text{padding:20px 22px}
  .lw-text h2{font-size:21px}
}
@media (max-width:560px){
  .agenda,.lcards{grid-template-columns:1fr}
  .agmoment{min-height:190px}
  .lifetop .ltme{display:none}  /* 移动端顶栏已有头像，不再重复 */
  .lw-text{padding-top:52px}
  .lw-cta{top:14px;right:14px}
  .lband .ph{min-height:172px}
  .lband .lbt{padding:18px 20px}
  /* 窄屏只露出素材中段，取景往左偏到空墙那侧，再压一层浅色让文字读得清 */
  .lband .ph img{object-position:22% 56%}
  .lband:has(.ph.ok) .lbt{background:linear-gradient(90deg,rgba(252,248,241,.88),rgba(252,248,241,.45) 62%,transparent)}
}

/* ============================================================
   账单页
   标题 + 公平建议（左）与主视觉 + 建议金额（右）→ 三张概览 + 一句话 →
   本月结算 | 快速操作 → 每一笔记录。金额清楚，但不做成财务后台。
   ============================================================ */
.bhero{display:grid;grid-template-columns:1.12fr .88fr;gap:16px;align-items:stretch;margin-bottom:14px}
.bh-left{display:flex;flex-direction:column;gap:14px}
.bh-head h1{font-size:30px;font-weight:600;color:var(--sage-deep);letter-spacing:-.01em}
.bh-head p{font-size:14px;color:var(--ink-2);margin-top:4px}
.bh-right{display:flex;flex-direction:column;gap:12px}
.bh-right .ph{flex:1;min-height:150px;border-radius:22px;background:var(--sand);border-color:var(--sand-2)}
.bh-right .ph img{object-position:50% 45%}

/* 公平建议：管家发现的一个情况，不是系统告警 */
.fairhero{display:flex;gap:14px;align-items:flex-start;background:var(--sage-soft);border:1px solid var(--sage-line);
  border-radius:22px;padding:20px 22px;flex:1}
.fairhero .fhi{width:40px;height:40px;border-radius:14px;background:var(--surface);color:var(--peach);display:grid;place-items:center;flex:none;box-shadow:var(--shadow)}
.fairhero .fhi svg{width:20px;height:20px}
/* 有灯泡插画时用插画，没图时退回线性图标 */
.fairhero .fhi{position:relative;overflow:hidden}
.fairhero .fhi img{position:absolute;inset:2px;width:auto;height:auto;max-width:36px;max-height:36px;margin:auto;object-fit:contain}
.fairhero .fhi.ok svg{display:none}
.fairhero .fhb{flex:1;min-width:0}
.fairhero h2{font-size:18px;font-weight:600;line-height:1.35;color:var(--sage-deep)}
.fairhero p{font-size:13.5px;color:var(--ink-2);line-height:1.6;margin-top:7px}
.fairhero .btnrow{margin-top:13px}
.fairhero .btn.pri{background:var(--sage);border-color:var(--sage)}
.fairhero .btn.pri:hover{background:var(--sage-deep);border-color:var(--sage-deep)}
.fairhero .btn:not(.pri){background:var(--surface);border-color:transparent;box-shadow:var(--shadow)}
.fairhero .fhf{font-size:12px;color:var(--ink-3);margin-top:11px;line-height:1.5}
.fairhero .fhf .srctag{display:block;margin-top:3px}
.fairdone{display:flex;gap:9px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:18px;
  padding:14px 16px;font-size:13.5px;color:var(--ink-2);line-height:1.55;box-shadow:var(--shadow)}
.fairdone svg{width:16px;height:16px;flex:none;color:var(--sage);margin-top:2px}
.fairpeople{background:var(--sage-soft);border:1px solid var(--sage-line);border-radius:22px;padding:14px 16px 16px}
.fairpeople .fpl{font-size:12px;color:var(--sage-deep);font-weight:600;margin-bottom:10px}
.fairpeople .fps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.fairpeople .fp{background:var(--surface);border-radius:16px;padding:12px 8px 11px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;box-shadow:var(--shadow)}
.fairpeople .fp b{font-family:var(--f-d);font-size:13px;font-weight:600}
.fairpeople .fpa{font-family:var(--f-d);font-size:19px;font-weight:700;color:var(--peach);font-variant-numeric:tabular-nums;line-height:1.1}
.fairpeople .fpd{font-size:11px;color:var(--ink-3);line-height:1.4}

/* 三张概览 + 一句话 */
.bstats{display:grid;grid-template-columns:1fr 1fr 1fr 1.05fr;gap:12px;margin-bottom:16px}
.bst{display:flex;gap:12px;align-items:flex-start;padding:15px 16px;border-radius:20px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.bst .bsi{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none}
.bst .bsi svg{width:19px;height:19px}
.bst.peach .bsi{background:var(--peach-soft);color:var(--peach)}
.bst.sky .bsi{background:var(--sky-soft);color:var(--sky)}
.bst.sage .bsi{background:var(--sage-soft);color:var(--sage-deep)}
.bst .bsl{font-size:12.5px;color:var(--ink-3);font-weight:500}
.bst .bsv{font-family:var(--f-d);font-size:24px;font-weight:700;line-height:1.15;margin-top:2px;font-variant-numeric:tabular-nums}
.bst .bsv small{font-size:13px;font-weight:500;color:var(--ink-3);margin-left:1px}
.bst.peach .bsv{color:var(--peach)}
.bst .bss{font-size:12px;color:var(--ink-3);margin-top:3px}
.bquote{display:grid;grid-template-columns:1fr 92px;gap:10px;align-items:center;padding:14px 12px 14px 18px;border-radius:20px;
  background:var(--cream);border:1px solid var(--sand-2);overflow:hidden}
.bquote p{font-family:var(--f-d);font-size:13.5px;font-weight:600;color:var(--sage-deep);line-height:1.55}
.bquote .ph{aspect-ratio:1/1;border-radius:14px;min-height:0}
.bquote .ph figcaption{font-size:10.5px;padding:6px}

/* 本月结算 | 快速操作 */
.bgrid{display:grid;grid-template-columns:1.55fr .8fr;gap:16px;align-items:start;margin-bottom:6px}
.bsettle{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px 20px 16px;box-shadow:var(--shadow)}
.bs-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.bs-head h2{font-size:18px;font-weight:600}
.bs-month{font-family:var(--f-d);font-size:13px;font-weight:600;color:var(--sage-deep);background:var(--sage-soft);border-radius:9px;padding:2px 9px}
.bs-hint{font-size:12.5px;color:var(--ink-3);margin-left:auto}
.bs-body{display:grid;grid-template-columns:1fr 200px;gap:14px;margin-top:14px;align-items:stretch}
.bs-rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.bs-rows li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px dashed var(--line)}
.bs-rows li:first-child{border-top:0;padding-top:4px}
.bs-rows .bsn{flex:1;min-width:0}
.bs-rows .bsn b{font-family:var(--f-d);font-size:14.5px;font-weight:600;display:block;line-height:1.3}
.bs-rows .bsn span{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.bs-rows .bsn i{font-style:normal;margin:0 4px;color:var(--ink-4)}
.bs-rows .pill{flex:none}
.bs-art{position:relative;border-radius:18px;min-height:0;background:var(--sand);border-color:var(--sand-2)}
.bs-art figcaption{position:absolute;top:12px;left:0;right:0}
.bs-quote{position:absolute;inset:0;display:flex;align-items:flex-end;padding:14px}
.bs-quote p{font-family:var(--f-d);font-size:14px;font-weight:600;line-height:1.5;color:var(--sage-deep)}
.bs-art.ok .bs-quote p{color:#3D6B52;text-shadow:0 1px 12px rgba(252,248,241,.95)}
.bs-art.ok .bs-quote{background:linear-gradient(180deg,transparent 40%,rgba(252,248,241,.9))}
.bs-foot{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.bs-tl{font-size:12px;color:var(--ink-3);font-weight:600;margin-bottom:7px}
.bs-trs{display:flex;flex-wrap:wrap;gap:8px}
.bs-tr{display:inline-flex;align-items:center;gap:6px;background:var(--cream);border:1px solid var(--sand-2);border-radius:999px;padding:5px 12px 5px 6px;font-size:13px}
.bs-tr b{font-weight:600;font-family:var(--f-d)}
.bs-tr svg{width:14px;height:14px;color:var(--ink-4)}
.bs-tr em{font-style:normal;font-family:var(--f-d);font-weight:700;color:var(--sage-deep);margin-left:4px;font-variant-numeric:tabular-nums}
.bs-def{display:flex;gap:7px;align-items:flex-start;font-size:12.5px;color:var(--ink-3);margin-top:10px;line-height:1.5}
.bs-def svg{width:14px;height:14px;flex:none;margin-top:2px}

.bside{display:flex;flex-direction:column;gap:12px}
.bquick{background:var(--surface);border:1px solid var(--sage-line);border-radius:22px;padding:18px 18px 16px;box-shadow:var(--shadow)}
.bquick h3,.btips b{font-family:var(--f-d);font-size:15px;font-weight:600}
.bquick .btn.big{width:100%;justify-content:center;padding:11px 14px;font-size:14px;border-radius:14px;margin-top:12px;
  background:var(--sage);border-color:var(--sage)}
.bquick .btn.big:hover{background:var(--sage-deep);border-color:var(--sage-deep)}
.bquick .bq-or{font-size:12px;color:var(--ink-3);margin:12px 0 7px}
.bquick .b2q{margin-top:8px}
.btips{display:flex;gap:11px;align-items:flex-start;background:var(--cream);border:1px solid var(--sand-2);border-radius:20px;padding:15px 16px}
.btips .bti{width:32px;height:32px;border-radius:11px;background:var(--surface);color:var(--peach);display:grid;place-items:center;flex:none;box-shadow:var(--shadow)}
.btips .bti svg{width:16px;height:16px}
.btips b{display:block;font-size:14px;line-height:1.35}
.btips p{font-size:12.5px;color:var(--ink-2);line-height:1.55;margin-top:4px}

/* 每一笔记录：像消费产品的账单，不像数据表 */
.blist{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.brow{display:grid;grid-template-columns:64px minmax(150px,1.4fr) auto minmax(100px,.9fr) auto 84px 62px auto;
  gap:12px;align-items:center;padding:13px 18px;border-top:1px solid var(--line);font-size:13px}
.brow:first-child{border-top:0}
.brow:hover{background:var(--cream)}
.brow.done{color:var(--ink-3)}
.brow.done .bwhat b,.brow.done .bamt{color:var(--ink-3)}
.bdate{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.bwhat{min-width:0}
.bwhat b{font-family:var(--f-d);font-size:14px;font-weight:600;display:block;line-height:1.3}
.bwhat span{font-size:12px;color:var(--ink-3);display:block;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bchips{display:flex;gap:4px;flex-wrap:wrap}
.bchip{font-size:11.5px;font-weight:500;padding:3px 9px;border-radius:9px;background:var(--peach-soft);color:var(--peach);white-space:nowrap}
.bchip.sage{background:var(--sage-soft);color:var(--sage-deep)}
.bchip.sky{background:var(--sky-soft);color:var(--sky)}
.bchip.src{background:var(--surface-2);color:var(--ink-3)}
.bpayer{display:flex;align-items:center;gap:6px;color:var(--ink-2);white-space:nowrap;font-size:12.5px}
.bpeople{display:flex;align-items:center;font-size:12px;color:var(--ink-3);white-space:nowrap}
.bpeople .av{margin-left:-6px;box-shadow:0 0 0 2px var(--surface)}
.bpeople .av:first-child{margin-left:0}
.bpeople span{margin-left:7px}
.bamt{font-family:var(--f-d);font-size:15px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.bstate .pill{white-space:nowrap}
.bact{display:flex;gap:5px;justify-content:flex-end;opacity:0;transition:opacity .12s}
.brow:hover .bact,.brow:focus-within .bact{opacity:1}

@media (max-width:1080px){
  .bhero,.bgrid{grid-template-columns:1fr}
  /* 单栏时建议金额紧跟建议本身，氛围图放到后面 */
  .bh-right{flex-direction:column-reverse}
  .bh-right .ph{min-height:150px}
  .bstats{grid-template-columns:1fr 1fr}
  .bs-body{grid-template-columns:1fr}
  .bs-art{min-height:150px}
  .bs-art img{object-position:50% 55%}   /* 横条只露中段：盆栽 + 柜面，文案压在渐隐区上 */
  .brow{grid-template-columns:64px 1fr auto 84px auto;grid-template-areas:"d w c a s" "d p q s x"}
  .bdate{grid-area:d} .bwhat{grid-area:w} .bchips{grid-area:c} .bamt{grid-area:a} .bstate{grid-area:s}
  .bpayer{grid-area:p} .bpeople{grid-area:q} .bact{grid-area:x;opacity:1}
}
@media (max-width:560px){
  .bstats{grid-template-columns:1fr}
  .bquote{grid-template-columns:1fr 84px}
  .fairpeople .fps{gap:5px}
  .fairpeople .fp{padding:10px 4px}
  .fairpeople .fpa{font-size:17px}
  .bs-hint{margin-left:0;width:100%}
  .brow{grid-template-columns:auto 1fr;grid-template-areas:"w w a" "p p s" "q q q" "d c c" "x x x";grid-template-columns:auto 1fr auto;gap:6px 10px;padding:13px 16px}
  .bdate{grid-area:d;align-self:center}
  .bwhat span{white-space:normal}
  .bact{justify-content:flex-start}
  .bh-head h1{font-size:26px}
}

/* ============================================================
   共识页
   新室友 Hero（文字左、场景图右，"一致"的原地展开成小对比区）→ 正在讨论（通栏，两张有场景的议题卡，
   每张卡里直接表态：同意 / 不同意 / 再想想，随时可改）→ 我们已经说好的（轻量行）
   右侧：发起讨论 / 小贴士 / 三个入口 / 氛围图。共识是过程，规则只是结果。
   ============================================================ */
.pill.sky{background:var(--sky-soft);color:var(--sky);border-color:color-mix(in srgb,var(--sky) 35%,transparent)}
.pill.peach{background:var(--peach-soft);color:var(--peach);border-color:color-mix(in srgb,var(--peach) 32%,transparent)}
.pill.warm{background:var(--peach-soft);color:var(--peach);border-color:transparent}

.thero{display:grid;grid-template-columns:1.15fr .95fr;align-items:stretch;background:linear-gradient(115deg,var(--sage-soft),var(--cream) 78%);
  border:1px solid var(--sage-line);border-radius:24px;overflow:hidden;margin-bottom:18px}
.th-left{display:flex;gap:18px;align-items:center;padding:24px 26px}
.th-left .av.xxl{width:64px;height:64px;font-size:21px;flex:none}
.th-text h1{font-size:23px;font-weight:600;line-height:1.3;color:var(--sage-deep)}
.th-text p{font-size:13.5px;color:var(--ink-2);margin-top:5px;line-height:1.55;max-width:34ch}
/* 两个状态入口：一致的可以原地展开看对比，正在讨论的点一下滚到下面的议题卡 */
.th-cmp{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.th-chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;border-radius:999px;padding:6px 12px 6px 10px;
  background:var(--surface);border:1px solid transparent;box-shadow:var(--shadow);color:var(--ink-2);white-space:nowrap}
.th-chip svg{width:13px;height:13px}
.th-chip.ok{color:var(--sage-deep)} .th-chip.talk{color:var(--peach)} .th-chip.done{color:var(--sage-deep);background:var(--sage-soft);box-shadow:none}
.th-chip i{font-style:normal;color:var(--ink-4);margin:0 1px}
.th-chip span{display:inline-flex;align-items:center;gap:1px;font-weight:500;color:var(--ink-3)}
.th-chip span svg{transform:rotate(90deg);transition:transform .15s}
.th-chip[aria-expanded="true"] span svg{transform:rotate(-90deg)}
button.th-chip:hover{border-color:var(--sage-line)}
/* 展开的小对比区：只做快速确认，一项一行，很紧凑 */
.th-same{margin-top:12px;background:color-mix(in srgb,var(--surface) 72%,transparent);border:1px solid var(--sage-line);border-radius:16px;padding:11px 12px 10px}
.ts-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.ts-h b{font-family:var(--f-d);font-size:13.5px;font-weight:600;color:var(--ink)}
.ts-close{display:inline-flex;align-items:center;gap:1px;background:none;border:0;padding:2px 0;font-size:12px;color:var(--sage-deep);font-weight:600}
.ts-close svg{width:13px;height:13px;transform:rotate(-90deg)}
.ts-grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:5px}
.ts-grid li{display:flex;align-items:center;gap:7px;min-width:0;background:var(--surface);border-radius:10px;padding:6px 9px 6px 7px;font-size:12.5px}
.ts-i{width:22px;height:22px;border-radius:7px;background:var(--sage-soft);color:var(--sage-deep);display:grid;place-items:center;flex:none}
.ts-i svg{width:12px;height:12px}
.ts-k{color:var(--ink-3);flex:none}
.ts-grid li b{font-family:var(--f-d);font-weight:600;color:var(--ink);flex:1;min-width:0;line-height:1.35}
.ts-grid li i{color:var(--sage);display:inline-flex;flex:none}
.ts-grid li i svg{width:13px;height:13px}
.th-same>.lcgo{margin:7px 0 0;padding:2px 0 0;font-weight:500}
.thero .ph{border:0;border-radius:0;aspect-ratio:auto;min-height:170px;background:var(--sand-2)}
.thero .ph img{object-position:55% 50%}
.tk-discuss{margin-bottom:16px}

.tgrid{display:grid;grid-template-columns:1.7fr .8fr;gap:16px;align-items:start}
.tmain{display:flex;flex-direction:column;gap:16px;min-width:0}
.tsec{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px 20px 18px;box-shadow:var(--shadow)}
.tk-h{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.tk-hi{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none}
.tk-hi svg{width:18px;height:18px}
.tk-hi.peach{background:var(--peach-soft);color:var(--peach)}
.tk-hi.sage{background:var(--sage-soft);color:var(--sage-deep)}
.tk-hi.plain{background:var(--surface-2);color:var(--ink-3)}
.tk-h h2{font-size:18px;font-weight:600;line-height:1.3}
.tk-h p{font-size:12.5px;color:var(--ink-3);margin-top:3px;line-height:1.5}
.tk-h>div{flex:1;min-width:0}
.tk-hc{font-size:12.5px;color:var(--ink-3);flex:none;padding-top:8px}
.tk-empty{background:var(--cream);border:1px dashed var(--sand-2);border-radius:16px;padding:18px;text-align:center;font-size:13px;color:var(--ink-3)}

/* 议题卡：上半是生活场景，下半是讨论内容 */
.tk-topics{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tk-topic{border-radius:20px;overflow:hidden;background:var(--cream);border:1px solid var(--sand-2);display:flex;flex-direction:column}
.tk-art{border:0;border-radius:0;aspect-ratio:2.3/1;min-height:0;background:var(--sand)}
.tk-body{padding:14px 16px 15px;display:flex;flex-direction:column;gap:9px;flex:1}
.tk-th{display:flex;align-items:center;gap:9px}
.tk-th h3{font-size:16px;font-weight:600;flex:1;line-height:1.3}
.tk-ic{width:34px;height:34px;border-radius:12px;background:var(--surface);color:var(--sage-deep);display:grid;place-items:center;flex:none;box-shadow:var(--shadow)}
.tk-ic svg{width:17px;height:17px}
.tk-vals{display:flex;flex-wrap:wrap;gap:6px}
.tk-vals span{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink-3);background:var(--surface);border-radius:999px;padding:4px 11px 4px 9px;box-shadow:var(--shadow)}
.tk-vals span b{color:var(--ink);font-family:var(--f-d);font-weight:600}
.tk-vals span .av{margin-right:1px}
.tk-sub{font-size:12.5px;color:var(--ink-2);line-height:1.55}
.tk-say{display:flex;gap:8px;align-items:flex-start;background:var(--surface);border-radius:14px;padding:10px 12px;font-size:12.5px;color:var(--ink-2);line-height:1.55;border-left:3px solid var(--sage-line)}
.tk-say i{width:20px;height:20px;border-radius:7px;background:var(--sage-soft);color:var(--sage-deep);display:grid;place-items:center;flex:none;margin-top:1px}
.tk-say i svg{width:12px;height:12px}
.tk-say em{display:block;font-style:normal;font-size:11.5px;color:var(--peach);margin-top:3px;font-weight:600}
.tk-say b{color:var(--ink);font-weight:600}
/* 每个人现在的态度：接受绿 / 不同意玫瑰 / 再想想暖橙 / 方案改了待重新确认 / Lin 偏好已提供 / 还没说 */
.tk-stances{display:flex;flex-wrap:wrap;gap:5px}
.tk-st{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-3);background:var(--surface-2);border-radius:999px;padding:3px 10px 3px 4px;white-space:nowrap}
.tk-st.agree{background:var(--sage-soft);color:var(--sage-deep);font-weight:500}
.tk-st.disagree{background:var(--rose-soft);color:var(--rose);font-weight:500}
.tk-st.undecided{background:var(--peach-soft);color:var(--peach);font-weight:500}
.tk-st.stale{background:var(--peach-soft);color:var(--peach)}
.tk-st.provided{background:var(--sky-soft);color:var(--sky)}
.tk-st.none .av{opacity:.55}
.tk-notes{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink-2);line-height:1.5}
.tk-notes div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk-notes b{font-weight:600;color:var(--ink-3);margin-right:5px}
.tk-notes b::after{content:'：'}
/* 我的那一块：问一句 → 三个态度 → 补充意见 */
.tk-ask{font-size:13px;font-weight:600;color:var(--ink);margin-top:2px}
.tk-ask.lin{display:flex;gap:7px;align-items:flex-start;font-weight:400;font-size:12.5px;color:var(--ink-2);line-height:1.5;background:var(--sky-soft);border-radius:12px;padding:9px 11px}
.tk-ask.lin svg{width:14px;height:14px;flex:none;margin-top:2px;color:var(--sky)}
.tk-ask.stale{display:flex;gap:7px;align-items:flex-start;font-weight:500;font-size:12.5px;color:var(--peach);line-height:1.5;background:var(--peach-soft);border-radius:12px;padding:9px 11px}
.tk-ask.stale svg{width:14px;height:14px;flex:none;margin-top:2px}
.tk-acts{margin-top:-2px;display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.tk-acts .btn{background:var(--surface);border-color:transparent;box-shadow:var(--shadow);padding:8px 10px;border-radius:12px}
.tk-acts .btn svg{width:13px;height:13px}
/* 已选的态度实心显示，另外两个还在，点一下就换 */
.tk-acts .btn.on.agree{background:var(--sage);border-color:var(--sage);color:#fff;box-shadow:none}
.tk-acts .btn.on.disagree{background:var(--rose-soft);border-color:var(--rose);color:var(--rose);box-shadow:none}
.tk-acts .btn.on.undecided{background:var(--peach-soft);border-color:var(--peach);color:var(--peach);box-shadow:none}
.tk-note{background:var(--surface);border:1px solid var(--sand-2);border-radius:14px;padding:11px 12px}
.tk-note label{font-size:12.5px;margin-bottom:6px}
.tk-note textarea{min-height:56px;font-size:13.5px;background:var(--ground);border-color:var(--sand-2)}
.tk-note .btnrow{margin-top:8px}
.tk-mynote{font-size:12.5px;color:var(--ink-2);line-height:1.5;background:var(--surface);border-radius:12px;padding:8px 11px}
.tk-mynote b{font-weight:600;color:var(--ink-3);margin-right:6px}
.tk-mynote b::after{content:'：'}
.tk-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:4px;flex-wrap:wrap}
.tk-state{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-3);line-height:1.4}
.tk-state svg{width:13px;height:13px;flex:none}
.tk-state.agree{color:var(--sage-deep)} .tk-state.disagree{color:var(--rose)} .tk-state.undecided{color:var(--peach)}
.tk-links{display:inline-flex;gap:14px;margin-left:auto}
.tk-links .lcgo{margin-left:0}
.tk-avs{display:inline-flex;flex:none}
.tk-avs .av{margin-left:-6px;box-shadow:0 0 0 2px var(--cream)}
.tk-avs .av:first-child{margin-left:0}
button.pill.warm{cursor:pointer}
button.pill.warm:hover{text-decoration:underline}
.pill.rose{background:var(--rose-soft);color:var(--rose);border-color:color-mix(in srgb,var(--rose) 32%,transparent)}

/* 讨论详情页 */
.tp-top{margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.tp-th{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tp-meta{font-size:12.5px;color:var(--ink-3)}
.tp-top .tk-acts{max-width:420px}
.tp-prop{font-size:14.5px;line-height:1.65;color:var(--ink)}
.tp-quote{color:var(--ink-2)}
.row .ttl .av.sm{width:22px;height:22px;font-size:9px}

/* 已经说好的：一行一条，很轻 */
.tk-rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tk-rule{display:grid;grid-template-columns:32px 1fr auto auto auto;gap:12px;align-items:center;padding:11px 0;border-top:1px dashed var(--line)}
.tk-rule:first-child{border-top:0;padding-top:4px}
.tk-ri{width:32px;height:32px;border-radius:11px;background:var(--sage-soft);color:var(--sage-deep);display:grid;place-items:center}
.tk-ri svg{width:15px;height:15px}
.tk-rt{min-width:0}
.tk-rt b{font-family:var(--f-d);font-size:14px;font-weight:600;display:block;line-height:1.3}
.tk-rt span{font-size:12.5px;color:var(--ink-3);display:block;line-height:1.5;margin-top:1px}
.tk-rt em{font-style:normal;font-size:11.5px;color:var(--ink-4);display:block;margin-top:2px}
.tk-rule .tk-avs .av{box-shadow:0 0 0 2px var(--surface)}
.tk-rd{font-size:12px;color:var(--ink-4);white-space:nowrap;font-variant-numeric:tabular-nums}
.tk-rules.held .tk-rule{grid-template-columns:32px 1fr auto}

/* 右栏 */
.taside{display:flex;flex-direction:column;gap:12px}
.tstart{background:var(--surface);border:1px solid var(--sage-line);border-radius:22px;padding:16px 16px 0;box-shadow:var(--shadow);overflow:hidden}
.tstart .btn.big{width:100%;justify-content:center;padding:12px 14px;font-size:14.5px;border-radius:14px;background:var(--sage);border-color:var(--sage)}
.tstart .btn.big:hover{background:var(--sage-deep);border-color:var(--sage-deep)}
.tstart p{font-size:12.5px;color:var(--ink-3);line-height:1.55;margin:11px 2px 12px}
.tstart .ph{border:0;border-radius:16px 16px 0 0;aspect-ratio:1.5/1;min-height:0;margin:0 -16px;background:var(--sand)}
.ttips{background:var(--cream);border:1px solid var(--sand-2);border-radius:20px;padding:15px 16px 13px}
.tt-h{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.tt-h b{font-family:var(--f-d);font-size:14.5px;font-weight:600}
.tt-i{width:30px;height:30px;border-radius:10px;background:var(--surface);display:grid;place-items:center;flex:none;box-shadow:var(--shadow);overflow:hidden}
.tt-i img{width:24px;height:24px;object-fit:contain}
.ttips ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.ttips li{display:flex;gap:7px;align-items:flex-start;font-size:12.5px;color:var(--ink-2);line-height:1.5}
.ttips li svg{width:14px;height:14px;flex:none;color:var(--sage);margin-top:2px}
.tlinks{display:flex;flex-direction:column;gap:6px}
.tlinks button{display:flex;align-items:center;gap:10px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:11px 12px;box-shadow:var(--shadow);text-align:left}
.tlinks button:hover{border-color:var(--sage-line);background:var(--sage-soft)}
.tlinks button>span:nth-child(2){flex:1;min-width:0}
.tlinks .tl-i{width:30px;height:30px;border-radius:10px;background:var(--surface-2);color:var(--ink-2);display:grid;place-items:center;flex:none}
.tlinks .tl-i svg{width:15px;height:15px}
.tlinks b{font-family:var(--f-d);font-size:13.5px;font-weight:600;display:block;line-height:1.3}
.tlinks em{font-style:normal;font-size:11.5px;color:var(--ink-3);display:block;margin-top:1px;line-height:1.45}
.tlinks button>svg{width:14px;height:14px;color:var(--ink-4);flex:none}
.taside>.ph{aspect-ratio:4/3;border-radius:22px;background:var(--sand)}

/* 收尾一句 */
.tend{display:flex;align-items:center;gap:16px;margin-top:26px;padding:6px 0 4px}
.tend i{flex:1;height:1px;background:var(--sand-2)}
.tend p{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-d);font-size:14px;font-weight:500;color:var(--sage-deep);text-align:center}
.tend p svg{width:14px;height:14px;color:var(--rose)}

@media (max-width:1080px){
  .thero{grid-template-columns:1fr}
  .thero .ph{order:-1;min-height:160px}
  .tgrid{grid-template-columns:1fr}
  .taside>.ph{aspect-ratio:16/9}
  .taside>.ph img{object-position:50% 30%}   /* 4:3 素材裁成 16:9 时往上取景，保住墙上的手写字 */
}
@media (max-width:760px){
  .tk-topics{grid-template-columns:1fr}
}
@media (max-width:560px){
  .th-left{flex-direction:column;align-items:flex-start;gap:12px;padding:20px 20px 22px}
  .th-text{width:100%}
  .th-text h1{font-size:20px}
  .ts-grid{grid-template-columns:1fr}
  .tk-acts .btn{padding:8px 6px;font-size:12px}
  .tp-top .tk-acts{max-width:none}
  .tk-rule{grid-template-columns:32px 1fr auto;grid-template-areas:"i t p" "i a d"}
  .tk-rule .tk-ri{grid-area:i;align-self:start} .tk-rule .tk-rt{grid-area:t} .tk-rule .pill{grid-area:p;align-self:start}
  .tk-rule .tk-avs{grid-area:a} .tk-rule .tk-rd{grid-area:d;justify-self:end}
  .tk-rules.held .tk-rule{grid-template-columns:32px 1fr auto;grid-template-areas:"i t b"}
  .tk-rules.held .tk-rule .btn{grid-area:b}
  .tend{flex-direction:column;gap:10px}
  .tend i{width:40px;flex:none}
}

/* ============================================================
   我的页
   身份卡（登记离家计划 = 临时外出）→ 我的生活偏好（个人，不是共同约定）→ 我的空间 | 我的物品 + 我的责任
   → 我的账单 | 与我相关的房屋服务 → 搬出与退租（准备清单，退租由机构确认）
   ============================================================ */
.mehead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.mehead .phead{margin-bottom:14px}
.mehead .ph{width:320px;height:96px;flex:none;border-radius:16px;min-height:0;background:var(--cream);border:1px dashed var(--sand-2)}
.mehead .ph::after{display:none}
.mehead .ph img{object-fit:contain;object-position:right center}

.meid{display:flex;align-items:center;gap:16px;padding:18px 22px;border-radius:22px;margin-bottom:14px}
.meid .av.xxl{width:64px;height:64px;font-size:21px}
.meid-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.meid-t>b{font-family:var(--f-d);font-size:19px;font-weight:600;line-height:1.2}
.meid-st{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink-2)}
.meid-meta{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-3);flex-wrap:wrap}
.meid-meta svg{width:13px;height:13px;color:var(--ink-4);flex:none}
.meid-meta i{font-style:normal;color:var(--ink-4)}
.meid-act{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.meid-act .btn.pri{background:var(--sage);border-color:var(--sage);border-radius:12px;padding:9px 16px}
.meid-act .btn.pri:hover{background:var(--sage-deep);border-color:var(--sage-deep)}
.meid-act small{font-size:12px;color:var(--ink-3)}

/* 偏好：个人的 */
.mepref{padding:16px 20px 14px;border-radius:22px;margin-bottom:16px}
.mp-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.ms-i{width:34px;height:34px;border-radius:12px;background:var(--sage-soft);color:var(--sage-deep);display:grid;place-items:center;flex:none}
.ms-i svg{width:17px;height:17px}
.mp-ht{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;flex:1;min-width:0}
.mp-ht b{font-family:var(--f-d);font-size:16px;font-weight:600}
.mp-ht span{font-size:12.5px;color:var(--ink-3)}
.mp-ht em{font-style:normal;color:var(--sage-deep);font-weight:600}
.mp-hint{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-3)}
.mp-hint svg{width:13px;height:13px;flex:none}
.mp-h .btn{border-radius:12px;border-color:var(--sage-line);color:var(--sage-deep)}
.mp-h .btn:hover{background:var(--sage-soft)}
.mp-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.mp-grid.all{margin-top:10px;grid-template-columns:repeat(4,1fr)}
.mp-tile{display:flex;align-items:center;gap:10px;background:var(--cream);border-radius:14px;padding:11px 12px;min-width:0}
.mp-ti{width:34px;height:34px;border-radius:11px;background:var(--surface);display:grid;place-items:center;color:var(--sage-deep);flex:none;box-shadow:var(--shadow)}
.mp-ti svg{width:16px;height:16px}
.mp-tile div{min-width:0}
.mp-tile span{display:block;font-size:12px;color:var(--ink-3)}
.mp-tile b{display:block;font-family:var(--f-d);font-size:14px;font-weight:600;line-height:1.35}
.mp-more{display:inline-flex;align-items:center;justify-content:center;gap:4px;background:var(--cream);border:1px dashed var(--sand-2);border-radius:14px;font-size:13px;font-weight:600;color:var(--sage-deep);padding:11px 12px}
.mp-more svg{width:14px;height:14px}
.mp-more:hover{background:var(--sage-soft)}
.mp-diff{display:flex;align-items:center;gap:8px;margin-top:12px;background:var(--peach-soft);border-radius:14px;padding:10px 13px;font-size:12.5px;color:var(--ink-2);line-height:1.5;flex-wrap:wrap}
.mp-diff>svg{width:15px;height:15px;color:var(--peach);flex:none}
.mp-diff span{flex:1;min-width:0}
.mp-diff .lcgo{margin-left:0}
.mp-src{display:flex;align-items:center;gap:5px;margin-top:10px;font-size:11.5px;color:var(--ink-4)}
.mp-src svg{width:11px;height:11px}

/* 双栏 */
.megrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;align-items:start}
.mecol{display:flex;flex-direction:column;gap:16px;min-width:0}
.mesec{padding:16px 18px;border-radius:22px;min-width:0}
.ms-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ms-h b{font-family:var(--f-d);font-size:16px;font-weight:600;flex:1;min-width:0}
.ms-h .btn{border-radius:10px}
.ms-h .lcgo{margin-left:0}
.ms-sub{font-size:12.5px;color:var(--ink-3)}
.melist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.melist li{display:flex;align-items:center;gap:11px;background:var(--cream);border-radius:14px;padding:10px 12px}
.melist li.dim{opacity:.6}
.ml-i{width:36px;height:36px;border-radius:12px;background:var(--surface);color:var(--ink-2);display:grid;place-items:center;flex:none;box-shadow:var(--shadow)}
.ml-i svg{width:17px;height:17px}
.melist li>div{flex:1;min-width:0}
.melist li b{display:block;font-family:var(--f-d);font-size:14px;font-weight:600;line-height:1.35}
.melist li>div>span{display:block;font-size:12px;color:var(--ink-3);margin-top:1px}
.melist li .pill{flex:none}
.melist.tasks .btn{flex:none;background:var(--sage);border-color:var(--sage);border-radius:10px}
.melist.tasks .btn:hover{background:var(--sage-deep);border-color:var(--sage-deep)}

/* 物品：缩略图位 + 管理为主、删除为次 */
.things{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.thing{display:flex;align-items:center;gap:12px;background:var(--cream);border-radius:16px;padding:10px 12px}
.thing .thumb{width:64px;height:64px;flex:none;border-radius:12px;min-height:0;background:var(--surface);border:1px dashed var(--sand-2)}
.thing .thumb::after{display:none}
.thing .thumb img{object-fit:contain;padding:4px}
.thing .thumb figcaption{padding:0;color:var(--ink-4);display:grid;place-items:center}
.thing .thumb figcaption svg{width:20px;height:20px}
.th-t{flex:1;min-width:0}
.th-t b{display:flex;align-items:center;gap:7px;font-family:var(--f-d);font-size:14.5px;font-weight:600;flex-wrap:wrap}
.th-t span{display:block;font-size:12.5px;color:var(--ink-2);margin-top:2px}
.th-t em{display:block;font-style:normal;font-size:11.5px;color:var(--ink-4);margin-top:2px}
.th-acts{display:flex;gap:6px;flex:none}
.th-acts .btn{border-radius:10px;border-color:var(--sage-line);color:var(--sage-deep)}
.th-acts .btn:hover{background:var(--sage-soft)}
.th-acts .btn.ghost{border-color:transparent;color:var(--ink-3);background:none}
.th-acts .btn.ghost:hover{background:var(--rose-soft);color:var(--rose)}

/* 账单摘要 / 与我相关的服务 */
.mebill{display:flex;align-items:center;gap:14px;background:var(--cream);border-radius:16px;padding:14px 16px}
.mebill>div{flex:1;min-width:0}
.mebill b{display:block;font-family:var(--f-d);font-size:15px;font-weight:600}
.mebill>div>span{display:block;font-size:12.5px;color:var(--ink-3);margin-top:2px}
.mebill em{font-style:normal;font-family:var(--f-d);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.mebill .btn{border-radius:12px}
.mesvc{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.svc{background:var(--cream);border-radius:16px;padding:12px 12px 11px;display:flex;flex-direction:column;gap:2px;min-width:0}
.svc-i{width:32px;height:32px;border-radius:11px;background:var(--surface);color:var(--sage-deep);display:grid;place-items:center;box-shadow:var(--shadow);margin-bottom:6px}
.svc-i svg{width:16px;height:16px}
.svc b{font-family:var(--f-d);font-size:13.5px;font-weight:600;line-height:1.3}
.svc span{font-size:12.5px;color:var(--ink-2)}
.svc span.warm{color:var(--peach);font-weight:600}
.svc em{font-style:normal;font-size:11.5px;color:var(--ink-4)}

/* 搬出与退租 */
.meout{display:flex;align-items:center;gap:18px;padding:18px 22px;border-radius:22px;margin-bottom:8px;background:linear-gradient(120deg,var(--cream),var(--surface) 60%)}
.mo-i{width:56px;height:56px;border-radius:18px;background:var(--peach-soft);color:var(--peach);display:grid;place-items:center;flex:none}
.mo-i svg{width:26px;height:26px}
.mo-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px}
.mo-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.mo-h b{font-family:var(--f-d);font-size:16px;font-weight:600}
.mo-h span{font-size:12.5px;color:var(--ink-3)}
.mo-chips{display:flex;flex-wrap:wrap;gap:6px}
.mo-chips span{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:5px 10px}
.mo-chips span svg{width:13px;height:13px;color:var(--ink-3)}
.mo-chips span.more{color:var(--ink-4)}
.mo-note{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-3)}
.mo-note svg{width:13px;height:13px;flex:none}
.meout>.btn.pri{background:var(--sage);border-color:var(--sage);border-radius:12px;padding:10px 18px;flex:none}
.meout>.btn.pri:hover{background:var(--sage-deep);border-color:var(--sage-deep)}
.chk.final .box{border-style:dashed;color:var(--ink-4)}
.chk.final .box svg{opacity:1}
.chk.final .ct{color:var(--ink-2)}

@media (max-width:1080px){
  .mp-grid,.mp-grid.all{grid-template-columns:repeat(3,1fr)}
  .mesvc{grid-template-columns:1fr 1fr}
}
@media (max-width:820px){ .megrid{grid-template-columns:1fr} }
@media (max-width:560px){
  .mehead .ph{display:none}
  .meid{flex-wrap:wrap} .meid-act{width:100%;align-items:stretch} .meid-act .btn{justify-content:center} .meid-act small{text-align:center}
  .mp-grid,.mp-grid.all{grid-template-columns:1fr 1fr}
  .mp-h .btn{width:100%;justify-content:center}
  .thing{flex-wrap:wrap} .th-acts{width:100%;justify-content:flex-end}
  .mesvc{grid-template-columns:1fr}
  .mebill{flex-wrap:wrap} .mebill .btn{width:100%;justify-content:center}
  .meout{flex-wrap:wrap} .meout>.btn.pri{width:100%;justify-content:center}
}

/* 生命周期受限时的说明卡 / 成员小卡 / 费用类型 / 可点的成员 */
.locked{display:flex;gap:14px;align-items:flex-start;margin-bottom:12px;background:var(--cream);border-color:var(--sand-2)}
.locked>.ms-i{background:var(--surface);color:var(--ink-3);box-shadow:var(--shadow)}
.locked b{font-family:var(--f-d);font-size:15px;font-weight:600;display:block}
.locked p{font-size:13.5px;color:var(--ink-2);line-height:1.6;margin-top:4px}
.person{cursor:pointer}
.person:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
.bchip.kind{background:var(--surface-2);color:var(--ink-3)}
.melist li .lcgo{margin-left:0;flex:none}
.melist li .btn{flex:none}
.who-pick button small{margin-left:2px}

/* ============ 「不好开口」流程里的示例按钮 ============ */
.bq{border:1px solid var(--line);background:var(--surface-2);border-radius:18px;padding:4px 11px;font-size:12.5px;color:var(--ink-2)}
.bq:hover{border-color:var(--jade-line);background:var(--jade-soft);color:var(--jade-ink)}

/* ============ feed ============ */
.feed{list-style:none;margin:0;padding:0}
.feed.bare li{border-bottom:1px dashed var(--line)}
.feed li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.feed li:last-child{border-bottom:0}
.feed .tx{flex:1;font-size:13.5px;color:var(--ink-2);line-height:1.5}
.feed .tx b{color:var(--ink);font-weight:600}
.feed .tm{font-size:11.5px;color:var(--ink-4);flex:none;font-variant-numeric:tabular-nums;padding-top:1px}
.feed .sysic{width:26px;height:26px;border-radius:50%;background:var(--surface-2);color:var(--ink-3);display:grid;place-items:center;flex:none}
.feed .sysic svg{width:13px;height:13px}

/* ============ pills / buttons ============ */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;border:1px solid transparent;white-space:nowrap;line-height:1.5}
.pill svg{width:12px;height:12px;flex:none}
.zone .zo svg{width:13px;height:13px;flex:none}
.ruleitem .rn svg{width:12px;height:12px}
.calcline .cl svg{width:14px;height:14px;flex:none;color:var(--ink-3)}
.opt svg{flex:none}
.pill.ok{background:var(--jade-soft);color:var(--jade-ink);border-color:var(--jade-line)}
.pill.warn{background:var(--amber-soft);color:var(--amber);border-color:var(--amber-line)}
.pill.hot{background:var(--clay-soft);color:var(--clay);border-color:var(--clay-line)}
.pill.info{background:var(--slate-soft);color:var(--slate);border-color:var(--slate-line)}
.pill.plain{background:var(--surface-2);color:var(--ink-3);border-color:var(--line)}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:7px 13px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .12s,border-color .12s;white-space:nowrap}
.btn:hover{background:var(--surface-2);border-color:var(--ink-4)}
.btn.pri{background:var(--jade);border-color:var(--jade);color:#fff}
.btn.pri:hover{background:var(--jade-ink);border-color:var(--jade-ink)}
.btn.ghost{border-color:transparent;background:var(--surface-2)}
.btn.danger{border-color:var(--clay-line);color:var(--clay);background:var(--clay-soft)}
.btn.danger:hover{background:var(--clay);color:#fff;border-color:var(--clay)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.wide{width:100%}
.btn svg{width:14px;height:14px;flex:none}
.btn[disabled]{opacity:.45;pointer-events:none}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:9px;overflow:hidden;background:var(--surface)}
.qty button{width:30px;height:29px;border:0;background:none;font-size:15px;line-height:1;color:var(--ink-2);display:grid;place-items:center}
.qty button:hover{background:var(--surface-2);color:var(--ink)}
.qty span{min-width:42px;text-align:center;font-family:var(--f-d);font-weight:600;font-size:13.5px;font-variant-numeric:tabular-nums;border-left:1px solid var(--line);border-right:1px solid var(--line);padding:3px 0}

/* ============ rows ============ */
.rows{display:flex;flex-direction:column}
.row{display:flex;gap:13px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0}
.row .ttl{font-family:var(--f-d);font-size:15px;font-weight:600;display:flex;align-items:center;gap:7px;flex-wrap:wrap;line-height:1.4}
.row .meta{font-size:12.5px;color:var(--ink-3);margin-top:2px;line-height:1.5}
.row .right{text-align:right;flex:none}
.row .amt{font-family:var(--f-d);font-size:16.5px;font-weight:600;font-variant-numeric:tabular-nums}
.row .per{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.row .cta{flex:none;display:flex;gap:6px}
.row.dim{opacity:.6}
.split{display:flex;gap:4px;margin-top:7px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);border-radius:20px;padding:2px 9px 2px 2px;font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}

/* ============ module entries ============ */
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:11px}
.mod{display:flex;gap:12px;align-items:flex-start;padding:14px 15px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);width:100%;transition:border-color .12s}
.mod:hover{border-color:var(--jade-line)}
.mod .mi{width:32px;height:32px;border-radius:10px;flex:none;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2)}
.mod .mi svg{width:16px;height:16px}
.mod .mn{font-family:var(--f-d);font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.mod .ms{font-size:12.5px;color:var(--ink-3);margin-top:2px;line-height:1.45}
.mod .flag{min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--clay);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;font-family:var(--f-d)}


/* ============ supplies ============ */
.segbar{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;margin-bottom:14px;border:1px solid var(--line);flex-wrap:wrap}
.seg{border:0;background:none;padding:6px 13px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink-3)}
.seg[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(224px,1fr));gap:11px}
.sup{padding:14px 15px;display:flex;flex-direction:column;gap:10px}
.sup .head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.sup .nm{font-family:var(--f-d);font-size:15px;font-weight:600}
.sup .th{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.sup .bar{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.sup .bar i{display:block;height:100%;border-radius:3px;background:var(--jade);transform-origin:left center;transition:transform .3s}
.sup.low .bar i{background:var(--clay)}
.sup .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto}
.sup.low{border-color:var(--clay-line);box-shadow:var(--shadow),inset 3px 0 0 var(--clay)}
.sup .owner{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.sup .rulenote{font-size:12px;color:var(--ink-3);background:var(--surface-2);border-radius:8px;padding:6px 9px;line-height:1.45}
/* 来源标签：这条信息是谁、什么时候、怎么产生的 */
.srctag{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-4);margin-top:6px;line-height:1.45}
.srctag svg{width:11px;height:11px;flex:none;opacity:.7}
.srctag + .srctag{margin-top:2px}
/* 状态型消耗品：只选档位，不数数量 */
.states{display:flex;gap:5px;flex-wrap:wrap}
.stbtn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:5px 10px;
  font-size:12.5px;color:var(--ink-2);font-weight:500}
.stbtn:hover{border-color:var(--jade);color:var(--jade-ink)}
.stbtn[aria-pressed="true"]{background:var(--jade);border-color:var(--jade);color:#fff;font-weight:600}
/* 报修进度：住户提交 → 机构处理 */
.timeline{margin-top:9px;border-left:2px solid var(--line);padding-left:12px;display:flex;flex-direction:column;gap:7px}
.tlrow{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);position:relative;flex-wrap:wrap}
.tlrow i{position:absolute;left:-17px;width:8px;height:8px;border-radius:50%;background:var(--ink-4)}
.tlrow i.member{background:var(--jade)}
.tlrow i.platform{background:var(--slate)}
.tlrow em{font-style:normal;color:var(--ink-4);font-size:11.5px;font-variant-numeric:tabular-nums}
.tlvia{font-size:10.5px;color:var(--ink-4);border:1px solid var(--line);border-radius:5px;padding:0 5px}

/* ============ spaces ============ */
.spgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:11px}
.space{padding:14px 15px}
.space h3{font-size:15px;display:flex;align-items:center;gap:7px;margin-bottom:10px}
.space h3 svg{width:15px;height:15px;color:var(--ink-3)}
.zones{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:11px;overflow:hidden}
.zone{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px;background:var(--surface)}
.zone:last-child{border-bottom:0}
.zone .zn{color:var(--ink-3);font-size:12px;min-width:44px}
.zone .zo{margin-left:auto;display:flex;align-items:center;gap:6px;font-weight:500}
.zone.mine{background:var(--jade-soft)}
.zone.mine .zn{color:var(--jade-ink)}
.zone.pub{background:var(--surface-2)}
.zone.pending{background:var(--amber-soft)}
.zone.pending .zo{opacity:.85}
.handnote{margin-top:9px;font-size:12px;color:var(--amber);background:var(--amber-soft);border:1px solid var(--amber-line);border-radius:9px;padding:7px 10px;line-height:1.45}

/* ============ fairness / ledger ============ */
.fair{border:1px solid var(--amber-line);background:var(--amber-soft);border-radius:var(--r);padding:14px 15px}
.fair .fh{display:flex;gap:8px;align-items:center;font-family:var(--f-d);font-weight:600;font-size:14.5px;color:var(--amber);margin-bottom:5px}
.fair .fh svg{width:15px;height:15px;flex:none}
.fair p{font-size:13.5px;color:var(--ink-2);line-height:1.55}
.calcbox{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-top:10px}
.calcline{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line)}
.calcline:last-child{border-bottom:0}
.calcline .cl{display:flex;align-items:center;gap:7px;color:var(--ink-2)}
.calcline .cv{font-family:var(--f-d);font-weight:600;font-variant-numeric:tabular-nums}
.calcline .cd{font-size:11.5px;color:var(--ink-3);margin-left:4px;font-weight:400}
.notice{background:var(--surface-2);border-radius:11px;padding:10px 12px;font-size:12.5px;color:var(--ink-2);line-height:1.5;display:flex;gap:8px;align-items:flex-start}
.notice svg{width:14px;height:14px;flex:none;margin-top:3px;color:var(--ink-3)}

/* ============ consensus ============ */
/* 正在发生的议题用实卡强调，已经说好的只用行，层级拉开 */
.live{background:var(--surface);border:1px solid var(--amber-line);border-left:3px solid var(--amber);
  border-radius:var(--r);padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:10px}
.live .lv-top{display:flex;gap:11px;align-items:flex-start}
.live .lv-top b{font-family:var(--f-d);font-size:15px;font-weight:600;display:block;line-height:1.4}
.live .lv-top span{font-size:12.5px;color:var(--ink-2);display:block;margin-top:2px;line-height:1.5}
.live .lv-ic{width:32px;height:32px;border-radius:10px;background:var(--amber-soft);color:var(--amber);
  display:grid;place-items:center;flex:none}
.live .lv-ic svg{width:16px;height:16px}
.live .lv-body{display:flex;flex-wrap:wrap;gap:6px}
.agreed{border-top:1px solid var(--line)}
.agreed .ruleitem{border-bottom:1px dashed var(--line);padding:12px 2px}
.agreed .ruleitem:last-child{border-bottom:0}
.ruleitem{display:flex;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);align-items:flex-start}
.ruleitem:last-child{border-bottom:0}
.ruleitem .rn{width:22px;height:22px;border-radius:7px;background:var(--surface-2);color:var(--ink-3);font-family:var(--f-d);font-size:11px;font-weight:600;display:grid;place-items:center;flex:none;margin-top:1px}
.ruleitem .rb{flex:1;min-width:0}
.ruleitem .rt{font-size:14.5px;font-weight:600;font-family:var(--f-d);display:flex;gap:7px;align-items:center;flex-wrap:wrap;line-height:1.45}
.ruleitem .rd{font-size:12.5px;color:var(--ink-3);margin-top:2px;line-height:1.5}
.diffrow{padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.diffrow:last-child{border-bottom:0}
.diffrow .dt{font-family:var(--f-d);font-weight:600;font-size:14px;display:flex;align-items:center;gap:7px}
.vals{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.val{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:4px 10px 4px 4px;font-size:12.5px}
.val b{font-weight:600;font-family:var(--f-d)}
.val.linkish{padding-left:10px;color:var(--jade);border-style:dashed;border-color:var(--jade-line);background:none;font-weight:600}
.val.linkish:hover{background:var(--jade-soft)}
.rulebox{border:1px solid var(--line);border-radius:13px;padding:12px 14px;margin-bottom:14px;background:var(--surface-2)}
.rulebox .rl{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin-bottom:3px}
.rulebox b{font-family:var(--f-d);font-size:15px;display:block}
.rulebox p{font-size:13px;color:var(--ink-2);margin-top:3px;line-height:1.55}
.gap{display:flex;gap:8px;align-items:flex-start;margin-top:10px;padding:9px 11px;border-radius:9px;font-size:13px;line-height:1.55}
.gap svg{width:14px;height:14px;flex:none;margin-top:3px}
.gap.over{background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber-line)}
.gap.ok{background:var(--jade-soft);color:var(--jade-ink);border:1px solid var(--jade-line)}
.suggest{margin-top:10px;background:var(--jade-soft);border:1px solid var(--jade-line);border-radius:11px;padding:10px 12px}
.suggest .sl{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--jade);font-weight:700}
.suggest p{font-size:13.5px;color:var(--jade-ink);margin-top:3px;line-height:1.5}

/* ============ stepper / quiz ============ */
.prog{display:flex;gap:4px;margin-bottom:18px}
.prog i{flex:1;height:3px;border-radius:2px;background:var(--surface-3)}
.prog i.on{background:var(--jade)}
.qnum{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
